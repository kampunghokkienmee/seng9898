      function todayKey(date = new Date()) {
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);

      function monthKey(value = new Date()) {

      function money(value) {

      function shiftHours(card) {
        if (!card?.clockIn) return 0;
        const start = new Date(card.clockIn).getTime();
        const end = card.clockOut ? new Date(card.clockOut).getTime() : Date.now();
        return Math.max(0, (end - start) / 3600000);
      }

      function formatHours(value) {
        return `${Number(value || 0).toFixed(1)}h`;
      }

      function escapeExcel(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function safeFileName(value) {
        return String(value || "report")
          .trim()
          .replace(/[\\/:*?"<>|]+/g, "-")
          .replace(/\s+/g, "-")
          .slice(0, 90);
      }

      function downloadExcelFile(filename, sections) {
        const content = sections
          .map((section) => {
            const rows = section.rows?.length ? section.rows : [["No data"]];
            const table = rows
              .map(
                (row) =>
                  `<tr>${row
                    .map((cell, index) =>
                      index === 0
                        ? `<td style="font-weight:700;">${escapeExcel(cell)}</td>`
                        : `<td>${escapeExcel(cell)}</td>`
                    )
                    .join("")}</tr>`
              )
              .join("");
            return `<h2>${escapeExcel(section.title)}</h2><table border="1" cellspacing="0" cellpadding="6">${table}</table>`;
          })
          .join("<br/>");
        const html = `<!doctype html><html><head><meta charset="UTF-8" /></head><body>${content}</body></html>`;
        const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${safeFileName(filename)}.xls`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function rangeLabel(range, selectedDate, selectedMonth) {
        if (range === "today") return selectedDate || todayKey();
        if (range === "month") return selectedMonth || monthKey();
        return "all-records";
      }

      function leaveDays(startDate, endDate) {
        const start = new Date(startDate || todayKey()).getTime();
        const end = new Date(endDate || startDate || todayKey()).getTime();
        if (!Number.isFinite(start) || !Number.isFinite(end)) return 1;
        return Math.max(1, Math.floor((end - start) / 86400000) + 1);
      }

      function summarizePayments(payments) {
        return payments.reduce(
          (acc, payment) => {
            acc.orders += 1;
            acc.subtotal += Number(payment.subtotal || 0);
            acc.service += Number(payment.service || 0);
            acc.gst += Number(payment.gst || 0);
            acc.discount += Number(payment.discount || 0);
            acc.total += Number(payment.total || 0);
            return acc;
          },
          { orders: 0, subtotal: 0, service: 0, gst: 0, discount: 0, total: 0 }
        );
      }

      let bellAudioContext = null;

      function playOrderBell() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!bellAudioContext) bellAudioContext = new AudioContext();
          if (bellAudioContext.state === "suspended") bellAudioContext.resume();

          [0, 170, 360, 570, 820].forEach((delay, index) => {
            setTimeout(() => {
              const oscillator = bellAudioContext.createOscillator();
              const gain = bellAudioContext.createGain();
              oscillator.type = "triangle";
              oscillator.frequency.setValueAtTime(index % 2 ? 1080 : 820, bellAudioContext.currentTime);
              gain.gain.setValueAtTime(0.0001, bellAudioContext.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.75, bellAudioContext.currentTime + 0.025);
              gain.gain.exponentialRampToValueAtTime(0.0001, bellAudioContext.currentTime + 0.26);
              oscillator.connect(gain);
              gain.connect(bellAudioContext.destination);
              oscillator.start();
              oscillator.stop(bellAudioContext.currentTime + 0.28);
            }, delay);
          });
        } catch (error) {
          // Audio can be blocked until the user taps Enable Bell.
        }
      }

      function summarizeSupplierRecords(records) {
        return records.reduce(
          (acc, record) => {
            const amount = Number(record.amount || 0);
            acc.total += amount;
            if (record.status === "Unpaid") acc.unpaid += amount;
            else acc.paid += amount;
            if (!acc.byCategory[record.category]) acc.byCategory[record.category] = 0;
            acc.byCategory[record.category] += amount;
            return acc;
          },
          { total: 0, paid: 0, unpaid: 0, byCategory: {} }
        );
      }

      function seedTables() {
        return Array.from({ length: 20 }, (_, index) => ({
          id: index + 1,
          status: "Available",
          orderId: null,
        }));
      }

      function cleanMenu(items) {
        return items.map((item) => ({
          popular: false,
          soldOut: false,
          ...item,
          price: Number(item.price || 0),
        }));
      }

      function saveStaffToState(current, nextStaff, editingStaff) {
        const staffList = current.staff?.length ? current.staff : defaultStaffDirectory;
        return {
          ...current,
          staff: editingStaff
            ? staffList.map((staff) => (staff.id === nextStaff.id ? nextStaff : staff))
            : [nextStaff, ...staffList],
          timecards: (current.timecards || []).map((card) =>
            card.staffId === nextStaff.id
              ? { ...card, staffName: nextStaff.name, role: nextStaff.role }
              : card
          ),
          leaveRequests: (current.leaveRequests || []).map((request) =>
            request.staffId === nextStaff.id
              ? { ...request, staffName: nextStaff.name, role: nextStaff.role }
              : request
          ),
        };
      }

      function deleteStaffFromState(current, id) {
        const staffList = current.staff?.length ? current.staff : defaultStaffDirectory;
        if (staffList.length <= 1) return current;
        return {
          ...current,
          staff: staffList.filter((staff) => staff.id !== id),
        };
      }

      function emptyState() {
        return {
          menuVersion: MENU_VERSION,
          settingsVersion: SETTINGS_VERSION,
          settings: { ...defaultSettings },
          menuCategories: [...CATEGORIES],
          staff: defaultStaffDirectory.map((staff) => ({ ...staff })),
          tables: seedTables(),
          menuItems: cleanMenu(defaultMenu),
          orders: [],
          kitchenTickets: [],
          payments: [],
          suppliers: defaultSuppliers.map((supplier) => ({ ...supplier })),
          supplierRecords: [],
          timecards: [],
          leaveRequests: [],
        };
      }

      function hydrateState(saved) {
        if (!saved) return emptyState();
        const shouldUseDefaultMenu = saved.menuVersion !== MENU_VERSION;
        const shouldUseDefaultSettings = saved.settingsVersion !== SETTINGS_VERSION;
        return {
          ...emptyState(),
          ...saved,
          menuVersion: MENU_VERSION,
          settingsVersion: SETTINGS_VERSION,
          settings: shouldUseDefaultSettings
            ? { ...defaultSettings, ...(saved.settings || {}), businessName: defaultSettings.businessName }
            : { ...defaultSettings, ...(saved.settings || {}) },
          menuCategories: saved.menuVersion === MENU_VERSION && saved.menuCategories?.length
            ? saved.menuCategories
            : [...CATEGORIES],
          staff: saved.staff?.length ? saved.staff : defaultStaffDirectory.map((staff) => ({ ...staff })),
          tables: saved.tables?.length === 20 ? saved.tables : seedTables(),
          menuItems: cleanMenu(shouldUseDefaultMenu ? defaultMenu : saved.menuItems?.length ? saved.menuItems : defaultMenu),
          orders: saved.orders || [],
          kitchenTickets: saved.kitchenTickets || [],
          payments: saved.payments || [],
          suppliers: saved.suppliers?.length ? saved.suppliers : defaultSuppliers.map((supplier) => ({ ...supplier })),
          supplierRecords: saved.supplierRecords || [],
          timecards: saved.timecards || [],
          leaveRequests: saved.leaveRequests || [],
        };
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return hydrateState(saved);
        } catch (error) {
          return emptyState();
        }
      }

      function normalizeCloudConfig(config, forceEnabled = false) {
        return {
          enabled: forceEnabled ? true : Boolean(config?.enabled),
          restaurantId: String(config?.restaurantId || defaultCloudConfig.restaurantId).trim() || defaultCloudConfig.restaurantId,
          apiKey: String(config?.apiKey || "").trim(),
          authDomain: String(config?.authDomain || "").trim(),
          databaseURL: String(config?.databaseURL || "").trim(),
          projectId: String(config?.projectId || "").trim(),
          appId: String(config?.appId || "").trim(),
        };
      }

      function toBase64Url(value) {
        const bytes = new TextEncoder().encode(value);
        const binary = Array.from(bytes, (byte) => String.fromCharCode(byte)).join("");
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function fromBase64Url(value) {
        const normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
        const padded = normalized + "=".repeat((4 - (normalized.length % 4)) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function encodeCloudConfig(config) {
        return toBase64Url(JSON.stringify(normalizeCloudConfig(config, true)));
      }

      function decodeCloudConfig(value) {
        return normalizeCloudConfig(JSON.parse(fromBase64Url(value)), true);
      }

      function cloudConfigFromUrl() {
        try {
          const hash = window.location.hash ? window.location.hash.slice(1) : "";
          if (!hash) return null;
          const params = new URLSearchParams(hash);
          const token = params.get("sync") || params.get("cloud");
          return token ? decodeCloudConfig(token) : null;
        } catch (error) {
          return null;
        }
      }

      function posPublicUrl() {
        return `${window.location.origin}${window.location.pathname}`;
      }

      function cloudSetupUrl(config) {
        return `${posPublicUrl()}#sync=${encodeCloudConfig(config)}`;
      }

      function loadCloudConfig() {
        const sharedConfig = cloudConfigFromUrl();
        if (sharedConfig) {
          localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(sharedConfig));
          if (window.history?.replaceState) {
            window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
          }
          return { ...defaultCloudConfig, ...sharedConfig };
        }

        try {
          const saved = JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY));
          return { ...defaultCloudConfig, ...normalizeCloudConfig(saved || {}) };
        } catch (error) {
          return { ...defaultCloudConfig };
        }
      }

      function getDeviceId() {
        const saved = localStorage.getItem(DEVICE_ID_KEY);
        if (saved) return saved;
        const next = uid("device");
        localStorage.setItem(DEVICE_ID_KEY, next);
        return next;
      }

      function sanitizeCloudPath(value) {
        return String(value || "default-store")
          .trim()
          .replace(/[.#$/[\]]/g, "-")
          .replace(/\s+/g, "-")
          .slice(0, 80) || "default-store";
      }

      function hasCloudConfig(config) {
        return Boolean(
          config?.enabled &&
          config.apiKey?.trim() &&
          config.databaseURL?.trim() &&
          config.projectId?.trim() &&
          config.restaurantId?.trim()
        );
      }

      function cloudStatePath(config) {
        return `restaurants/${sanitizeCloudPath(config.restaurantId)}/posState`;
      }

      function firebaseOptions(config) {
        return {
          apiKey: config.apiKey.trim(),
          authDomain: config.authDomain.trim() || undefined,
          databaseURL: config.databaseURL.trim(),
          projectId: config.projectId.trim(),
          appId: config.appId.trim() || undefined,
        };
      }

      function calcOrder(order) {
        const subtotal = roundCurrency((order?.items || []).reduce((sum, item) => sum + item.price * item.qty, 0));
        const discount = roundCurrency(order?.discount || 0);
        const service = roundCurrency(subtotal * SERVICE_RATE);
        const gst = roundCurrency((subtotal + service - discount) * TAX_RATE);
        const total = roundCurrency(Math.max(0, subtotal + service + gst - discount));
        return { subtotal, service, gst, discount, total };
      }

      function statusClass(status) {
        const map = {
          Available: "border-emerald-400/40 bg-emerald-500/10 text-emerald-200",
          Occupied: "border-orange/50 bg-orange/15 text-orange2",
          Reserved: "border-sky-400/40 bg-sky-500/10 text-sky-200",
          Cleaning: "border-violet-400/40 bg-violet-500/10 text-violet-200",
          Open: "border-orange/50 bg-orange/15 text-orange2",
          Held: "border-amber-400/40 bg-amber-500/10 text-amber-200",
          Sent: "border-sky-400/40 bg-sky-500/10 text-sky-200",
          Paid: "border-emerald-400/40 bg-emerald-500/10 text-emerald-200",
          Cancelled: "border-rose-400/40 bg-rose-500/10 text-rose-200",
          New: "border-orange/50 bg-orange/15 text-orange2",
          Preparing: "border-sky-400/40 bg-sky-500/10 text-sky-200",
          Ready: "border-emerald-400/40 bg-emerald-500/10 text-emerald-200",
          Served: "border-zinc-500/40 bg-zinc-500/10 text-zinc-300",
        };
        return map[status] || "border-line bg-white/5 text-zinc-300";
      }

      function cx(...classes) {
        return classes.filter(Boolean).join(" ");
      }

      function LoginScreen({ state, setState, onLogin }) {
        const [mode, setMode] = useState("staff");
        const staffDirectory = state.staff?.length ? state.staff : defaultStaffDirectory;
        const settings = { ...defaultSettings, ...(state.settings || {}) };
        const [staffId, setStaffId] = useState(staffDirectory[0].id);
        const [pin, setPin] = useState("");
        const [message, setMessage] = useState("");

        const selectedStaff = staffDirectory.find((staff) => staff.id === staffId) || staffDirectory[0];
        const activeCard = state.timecards.find(
          (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
        );

        useEffect(() => {
          if (!staffDirectory.find((staff) => staff.id === staffId)) {
            setStaffId(staffDirectory[0]?.id || "");
          }
        }, [staffDirectory, staffId]);

        const todayPayments = state.payments.filter((payment) => payment.date === todayKey());

        const openOrderCount = state.orders.filter((order) => !["Paid", "Cancelled"].includes(order.status)).length;

          (ticket) => !ticket.archived && ticket.status !== "Served"

          .split(" ")
          .map((part) => part[0])

          .slice(0, 2)

        function submitLogin() {
          const user =
            mode === "manager"
              ? pin === settings.managerPin
                ? { id: "manager", name: settings.managerName, role: "manager" }
                : null
              : staffDirectory.find((item) => item.id === staffId && item.pin === pin);
          if (!user) {
            setMessage("Wrong PIN. You can edit staff PINs and manager PIN in Setup after manager login.");
            return;

          const session =
            mode === "manager"
              ? { id: user.id, name: user.name, role: "manager" }
              : { id: user.id, name: user.name, role: "staff", title: user.role };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          onLogin(session);

          setState((current) => {
            const openCard = current.timecards.find(
              (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !openCard) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: selectedStaff.id,
                    staffName: selectedStaff.name,
                    role: selectedStaff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,

              return {

                timecards: current.timecards.map((card) =>
                  card.id === openCard.id ? { ...card, clockOut: now } : card
                ),
              };
            }
            return current;
          });

                            value={staffId}
                            onChange={(event) => setStaffId(event.target.value)}
                            className="mt-1 min-h-11 w-full rounded-md border border-zinc-200 bg-white px-3 text-base font-bold text-zinc-950 outline-none focus:border-orange"
                          >
                            {staffDirectory.map((staff) => (
                              <option key={staff.id} value={staff.id}>
                                {staff.name} - {staff.role}
                              </option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <button
                          onClick={() => clock("in")}
                          className="min-h-14 rounded-lg border border-emerald-300 bg-emerald-50 font-black text-emerald-700"
                        >
                          Clock In
                        </button>
                        <button
                          onClick={() => clock("out")}
                          className="min-h-14 rounded-lg border border-zinc-200 bg-zinc-50 font-black text-zinc-700"
                        >
                          Clock Out
                        </button>
                      </div>

                      <div className="rounded-lg border border-zinc-200 bg-zinc-50 p-3 text-sm text-zinc-500">
                        <div className="flex items-center justify-between gap-3">
                          <span>Shift Status</span>
                          <span className={activeCard ? "font-black text-emerald-700" : "font-black text-zinc-700"}>
                            {activeCard ? `On duty ${displayTime(activeCard.clockIn)}` : "Off duty"}
                          </span>
                        </div>
                      </div>
                    </div>
                  )}

                  <label className="text-sm font-bold text-zinc-500">PIN</label>
                  <input
                    value={pin}
                    onChange={(event) => setPin(event.target.value)}
                    onKeyDown={(event) => {
                      if (event.key === "Enter") submitLogin();
                    }}
                    inputMode="numeric"
                    type="password"
                    placeholder={mode === "manager" ? "Manager PIN" : "Staff PIN"}
                    className="mt-2 min-h-16 w-full rounded-lg border border-zinc-200 bg-zinc-50 px-5 text-center text-3xl font-black tracking-[.45em] text-zinc-950 outline-none focus:border-orange"
                  />
                  <button
                    onClick={submitLogin}
                    className="mt-4 min-h-16 w-full rounded-lg bg-orange px-5 text-lg font-black text-black transition active:scale-[.99]"
                  >
                    Enter POS
                  </button>

                  <div className="mt-4 grid grid-cols-3 gap-2 text-center text-sm">
                    <div className="rounded-lg border border-zinc-200 bg-zinc-50 p-3">
                      <div className="font-black text-zinc-950">{onDutyCount}</div>
                      <div className="mt-1 text-zinc-500">On Duty</div>
                    </div>
                    <div className="rounded-lg border border-zinc-200 bg-zinc-50 p-3">
                      <div className="font-black text-zinc-950">{openOrderCount}</div>
                      <div className="mt-1 text-zinc-500">Orders</div>
                    </div>
                    <div className="rounded-lg border border-zinc-200 bg-zinc-50 p-3">
                      <div className="font-black text-zinc-950">{money(todaySales)}</div>
                      <div className="mt-1 text-zinc-500">Today</div>
                    </div>
                  </div>

                  <button
                    onClick={resetDemo}
                    className="mt-4 min-h-11 w-full rounded-lg border border-zinc-200 bg-white px-5 text-sm font-bold text-zinc-500 transition active:scale-[.99]"
                  >
                    Reset Demo Data
                  </button>
                  <p className="mt-4 min-h-10 text-sm leading-6 text-zinc-500">{message}</p>
                </div>
              </div>
            </section>
          </main>
        );
      }

      function AppShell({ user, setUser, state, setState, cloudConfig, setCloudConfig, syncStatus }) {
        const settings = { ...defaultSettings, ...(state.settings || {}) };
        const staffDirectory = state.staff?.length ? state.staff : defaultStaffDirectory;
        const menuCategories = state.menuCategories?.length ? state.menuCategories : CATEGORIES;
        const [view, setView] = useState("tables");
        const [selectedTableId, setSelectedTableId] = useState(1);
        const [activeOrderId, setActiveOrderId] = useState(null);
        const [selectedOrderId, setSelectedOrderId] = useState(null);
        const [receipt, setReceipt] = useState(null);

        const openOrders = state.orders.filter((order) => !["Paid", "Cancelled"].includes(order.status));
        const activeOrder = openOrders.find((order) => order.id === activeOrderId) || null;
        const selectedOrder = openOrders.find((order) => order.id === selectedOrderId) || activeOrder || openOrders[0] || null;
        const todayPayments = state.payments.filter((payment) => payment.date === todayKey());
        const onDuty = state.timecards.filter((card) => card.date === todayKey() && !card.clockOut);
        const syncTone =
          syncStatus.kind === "online"
            ? "border-emerald-400/30 bg-emerald-500/10 text-emerald-200"
            : syncStatus.kind === "error"
            ? "border-rose-400/30 bg-rose-500/10 text-rose-200"
            : syncStatus.kind === "syncing" || syncStatus.kind === "connecting"
            ? "border-sky-400/30 bg-sky-500/10 text-sky-200"
            : "border-line bg-panel text-zinc-300";

        function logout() {
          localStorage.removeItem(SESSION_KEY);
          setUser(null);
        }

        function resetDemo() {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SESSION_KEY);
          setState(emptyState());
          setActiveOrderId(null);
          setSelectedOrderId(null);
          setReceipt(null);
          setSelectedTableId(1);
          setView("tables");
          setUser(null);
        }

        function createOrderForTable(tableId) {
          const table = state.tables.find((item) => item.id === tableId);
          setSelectedTableId(tableId);
          if (table?.orderId) {
            const existing = state.orders.find((order) => order.id === table.orderId);
            if (existing) {
              setActiveOrderId(existing.id);
              setSelectedOrderId(existing.id);
              setView("pos");
              return;
            }
          }

          const order = {
            id: uid("order"),
            number: `T${String(tableId).padStart(2, "0")}-${Date.now().toString().slice(-4)}`,
            type: "Dine In",
            tableId,
            items: [],
            discount: 0,
            status: "Open",
            createdAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            tables: current.tables.map((item) =>
              item.id === tableId ? { ...item, status: "Occupied", orderId: order.id } : item
            ),
            orders: [order, ...current.orders],
          }));
          setActiveOrderId(order.id);
          setSelectedOrderId(order.id);
          setView("pos");
        }

        function createTakeawayOrder() {
          const order = {
            id: uid("order"),
            number: `TA-${Date.now().toString().slice(-5)}`,
            type: "Takeaway",
            tableId: null,
            items: [],
            discount: 0,
            status: "Open",
            createdAt: new Date().toISOString(),
          };
          setState((current) => ({ ...current, orders: [order, ...current.orders] }));
          setActiveOrderId(order.id);
          setSelectedOrderId(order.id);
          setView("pos");
        }

        function updateTableStatus(tableId, status) {
          setState((current) => ({
            ...current,
            tables: current.tables.map((table) => {
              if (table.id !== tableId) return table;
              if (status === "Available") return { ...table, status, orderId: null };
              return { ...table, status };
            }),
          }));
        }

        function addItem(menuItem) {
          if (menuItem.soldOut) return;
          let orderId = activeOrderId;

          setState((current) => {
            let orders = current.orders;
            let tables = current.tables;
            let order = orders.find((item) => item.id === orderId);

            if (!order) {
              const tableId = selectedTableId || 1;
              order = {
                id: uid("order"),
                number: `T${String(tableId).padStart(2, "0")}-${Date.now().toString().slice(-4)}`,
                type: "Dine In",
                tableId,
                items: [],
                discount: 0,
                status: "Open",
                createdAt: new Date().toISOString(),
              };
              orderId = order.id;
              orders = [order, ...orders];
              tables = tables.map((table) =>
                table.id === tableId ? { ...table, status: "Occupied", orderId: order.id } : table
              );
            }

            const nextOrders = orders.map((item) => {
              if (item.id !== order.id) return item;
              const existing = item.items.find((line) => line.menuId === menuItem.id && !line.note);
              const lines = existing
                ? item.items.map((line) =>
                    line.id === existing.id ? { ...line, qty: line.qty + 1 } : line
                  )
                : [
                    ...item.items,
                    {
                      id: uid("line"),
                      menuId: menuItem.id,
                      name: menuItem.name,
                      category: menuItem.category,
                      price: Number(menuItem.price),
                      image: menuItem.image,
                      qty: 1,
                      note: "",
                    },
                  ];
              return { ...item, items: lines, status: item.status === "Held" ? "Open" : item.status };
            });

            return { ...current, tables, orders: nextOrders };
          });

          setTimeout(() => {
            setActiveOrderId(orderId);
            setSelectedOrderId(orderId);
          }, 0);
        }

        function updateLine(orderId, lineId, patch) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) => {
              if (order.id !== orderId) return order;
              const items = order.items
                .map((line) => (line.id === lineId ? { ...line, ...patch(line) } : line))
                .filter((line) => line.qty > 0);
              return { ...order, items };
            }),
          }));
        }

        function deleteLine(orderId, lineId) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) =>
              order.id === orderId ? { ...order, items: order.items.filter((line) => line.id !== lineId) } : order
            ),
          }));
        }

        function holdOrder(orderId) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) =>
              order.id === orderId ? { ...order, status: "Held", heldAt: new Date().toISOString() } : order
            ),
          }));
        }

        function sendToKitchen(orderId) {
          const order = state.orders.find((item) => item.id === orderId);
          if (!order || order.items.length === 0) return;
          const ticket = {
            id: uid("ticket"),
            orderId: order.id,
            orderNumber: order.number,
            tableId: order.tableId,
            items: order.items.map((item) => ({ ...item })),
            status: "New",
            createdAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            orders: current.orders.map((item) =>
              item.id === orderId ? { ...item, status: "Sent", sentAt: new Date().toISOString() } : item
            ),
            kitchenTickets: [ticket, ...current.kitchenTickets],
          }));
          playOrderBell();
          setView("kds");
        }

        function updateDiscount(orderId, discount) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) =>
              order.id === orderId ? { ...order, discount: Math.max(0, Number(discount || 0)) } : order
            ),
          }));
        }

        function completePayment(order, method, splitCount, paymentMeta = {}) {
          const totals = calcOrder(order);
          if (!order || order.items.length === 0 || totals.total <= 0) return;

          const payment = {
            id: uid("pay"),
            orderId: order.id,
            orderNumber: order.number,
            tableId: order.tableId,
            method,
            splitCount,
            tendered: Number(paymentMeta.tendered || totals.total),
            changeDue: Number(paymentMeta.changeDue || 0),
            reference: paymentMeta.reference || "",
            collectedBy: user.name,
            date: todayKey(),
            paidAt: new Date().toISOString(),
            items: order.items.map((item) => ({ ...item })),
            ...totals,
          };

          setState((current) => ({
            ...current,
            payments: [payment, ...current.payments],
            orders: current.orders.map((item) =>
              item.id === order.id ? { ...item, status: "Paid", paidAt: payment.paidAt, paymentId: payment.id } : item
            ),
            tables: current.tables.map((table) =>
              table.id === order.tableId ? { ...table, status: "Cleaning", orderId: null } : table
            ),
          }));
          setReceipt(payment);
          setSelectedOrderId(null);
          if (activeOrderId === order.id) setActiveOrderId(null);
        }

        function cancelOrder(order, reason = "Cancelled at cashier") {
          if (!order) return;
          const now = new Date().toISOString();
          setState((current) => ({
            ...current,
            orders: current.orders.map((item) =>
              item.id === order.id
                ? {
                    ...item,
                    status: "Cancelled",
                    cancelledAt: now,
                    cancelledBy: user.name,
                    cancelReason: reason,
                  }
                : item
            ),
            tables: current.tables.map((table) =>
              table.id === order.tableId && table.orderId === order.id
                ? { ...table, status: "Available", orderId: null }
                : table
            ),
            kitchenTickets: current.kitchenTickets.map((ticket) =>
              ticket.orderId === order.id && !ticket.archived
                ? { ...ticket, status: "Cancelled", archived: true, archivedAt: now, updatedAt: now }
                : ticket
            ),
          }));
          setSelectedOrderId(null);
          if (activeOrderId === order.id) setActiveOrderId(null);
        }

        function updateKitchenStatus(ticketId, status) {
          setState((current) => ({
            ...current,
            kitchenTickets: current.kitchenTickets.map((ticket) =>
              ticket.id === ticketId
                ? { ...ticket, status, archived: false, updatedAt: new Date().toISOString() }
                : ticket
            ),
          }));
        }

        function archiveKitchenTicket(ticketId) {
          setState((current) => ({
            ...current,
            kitchenTickets: current.kitchenTickets.map((ticket) =>
              ticket.id === ticketId
                ? { ...ticket, archived: true, archivedAt: new Date().toISOString(), updatedAt: new Date().toISOString() }
                : ticket
            ),
          }));
        }

        function archiveServedTickets() {
          const now = new Date().toISOString();
          setState((current) => ({
            ...current,
            kitchenTickets: current.kitchenTickets.map((ticket) =>
              ticket.status === "Served" && !ticket.archived
                ? { ...ticket, archived: true, archivedAt: now, updatedAt: now }
                : ticket
            ),
          }));
        }

        function removeKitchenTicket(ticketId) {
          setState((current) => ({
            ...current,
            kitchenTickets: current.kitchenTickets.filter((ticket) => ticket.id !== ticketId),
          }));
        }

        function clockCurrentUser(type) {
          const staff = staffDirectory.find((item) => item.id === user.id);
          if (!staff) return;
          const now = new Date().toISOString();
          setState((current) => {
            const open = current.timecards.find(
              (card) => card.staffId === staff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !open) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: staff.id,
                    staffName: staff.name,
                    role: staff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,
                  },
                  ...current.timecards,
                ],
              };
            }
            if (type === "out" && open) {
              return {
                ...current,
                timecards: current.timecards.map((card) =>
                  card.id === open.id ? { ...card, clockOut: now } : card
                ),
              };
            }
            return current;
          });
        }

        return (
          <div className="flex min-h-screen bg-ink text-white">
            <aside className="flex w-24 shrink-0 flex-col border-r border-line bg-black/30 px-3 py-4 lg:w-28">
              <button
                onClick={() => setView("tables")}
                className="mb-5 flex h-16 items-center justify-center rounded-lg bg-orange text-xl font-black text-black"
              >
                AP
              </button>
              <nav className="flex flex-1 flex-col gap-2">
                {navItems
                  .filter((item) => user.role === "manager" || !item.managerOnly)
                  .map((item) => (
                    <button
                      key={item.id}
                      data-testid={`nav-${item.id}`}
                      onClick={() => setView(item.id)}
                      className={cx(
                        "min-h-16 rounded-lg border px-2 text-sm font-semibold transition active:scale-[.98]",
                        view === item.id
                          ? "border-orange bg-orange text-black"
                          : "border-transparent bg-panel text-zinc-300 hover:border-line"
                      )}
                      title={item.label}
                    >
                      <div className="text-lg font-black">{item.icon}</div>
                      <div>{item.label}</div>
                    </button>
                  ))}
              </nav>
              <button
                onClick={logout}
                className="mt-4 min-h-14 rounded-lg border border-line bg-panel text-sm font-semibold text-zinc-300"
              >
                Logout
              </button>
            </aside>

            <main className="flex min-w-0 flex-1 flex-col">
              <header className="flex min-h-20 items-center justify-between border-b border-line bg-ink/95 px-5">
                <div>
                  <div className="text-sm font-semibold uppercase tracking-[.18em] text-orange2">
                    {view === "kds" ? "Kitchen Display" : "Restaurant POS"}
                  </div>
                  <h2 className="text-2xl font-semibold tracking-normal">
                    {settings.businessName} / {navItems.find((item) => item.id === view)?.label || "Tables"}
                  </h2>
                </div>
                <div className="flex items-center gap-3">
                  <div className="hidden rounded-lg border border-line bg-panel px-4 py-3 text-right md:block">
                    <div className="text-sm text-zinc-400">{displayDateTime()}</div>
                    <div className="font-semibold">
                      {user.name} <span className="text-zinc-500">/</span> {user.role === "staff" ? user.title : "manager"}
                    </div>
                  </div>
                  {user.role === "staff" && (
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => clockCurrentUser("in")}
                        className="min-h-12 rounded-lg border border-emerald-400/30 bg-emerald-500/10 px-4 text-sm font-semibold text-emerald-200"
                      >
                        Clock In
                      </button>
                      <button
                        onClick={() => clockCurrentUser("out")}
                        className="min-h-12 rounded-lg border border-line bg-panel px-4 text-sm font-semibold"
                      >
                        Clock Out
                      </button>
                    </div>
                  )}
                  <div className="rounded-lg border border-line bg-panel px-4 py-3">
                    <div className="text-xs text-zinc-400">On Duty</div>
                    <div className="text-xl font-bold text-emerald-300">{onDuty.length}</div>
                  </div>
                  <div className="rounded-lg border border-line bg-panel px-4 py-3">
                    <div className="text-xs text-zinc-400">Today Sales</div>
                    <div className="text-xl font-bold text-orange2">
                      {money(todayPayments.reduce((sum, payment) => sum + payment.total, 0))}
                    </div>
                  </div>
                  <div className={cx("hidden rounded-lg border px-4 py-3 lg:block", syncTone)}>
                    <div className="text-xs opacity-75">Sync</div>
                    <div className="text-sm font-black">{syncStatus.label}</div>
                  </div>
                  {user.role === "manager" && (
                    <button
                      onClick={resetDemo}
                      className="min-h-14 rounded-lg border border-line bg-panel px-4 text-sm font-bold text-zinc-300"
                    >
                      Reset Demo
                    </button>
                  )}
                </div>
              </header>

              <section className="min-h-0 flex-1 overflow-hidden">
                {view === "tables" && (
                  <TablesView
                    tables={state.tables}
                    orders={state.orders}
                    onOpenTable={createOrderForTable}
                    onStatus={updateTableStatus}
                    onTakeaway={createTakeawayOrder}
                  />
                )}
                {view === "pos" && (
                  <PosView
                    menuItems={state.menuItems}
                    categories={menuCategories}
                    order={activeOrder}
                    selectedTableId={selectedTableId}
                    openOrders={openOrders}
                    onSelectOrder={(orderId) => {
                      setActiveOrderId(orderId);
                      setSelectedOrderId(orderId);
                    }}
                    onAdd={addItem}
                    onQty={(lineId, delta) =>
                      activeOrder && updateLine(activeOrder.id, lineId, (line) => ({ qty: line.qty + delta }))
                    }
                    onNote={(lineId, note) =>
                      activeOrder && updateLine(activeOrder.id, lineId, () => ({ note }))
                    }
                    onDelete={(lineId) => activeOrder && deleteLine(activeOrder.id, lineId)}
                    onDiscount={(discount) => activeOrder && updateDiscount(activeOrder.id, discount)}
                    onHold={() => activeOrder && holdOrder(activeOrder.id)}
                    onSend={() => activeOrder && sendToKitchen(activeOrder.id)}
                    onPay={() => {
                      if (activeOrder) {
                        setSelectedOrderId(activeOrder.id);
                        setView("cashier");
                      }
                    }}
                    onNewTakeaway={createTakeawayOrder}
                    onTables={() => setView("tables")}
                  />
                )}
                {view === "kds" && (
                  <KdsView
                    tickets={state.kitchenTickets}
                    onStatus={updateKitchenStatus}
                    onArchive={archiveKitchenTicket}
                    onArchiveServed={archiveServedTickets}
                    onRemove={removeKitchenTicket}
                  />
                )}
                {view === "cashier" && (
                  <CashierView
                    orders={openOrders}
                    selectedOrder={selectedOrder}
                    onSelect={(orderId) => setSelectedOrderId(orderId)}
                    onPayment={completePayment}
                    onCancel={cancelOrder}
                    onTables={() => setView("tables")}
                  />
                )}
                {view === "reports" && (
                  <ReportsView payments={state.payments} supplierRecords={state.supplierRecords || []} />
                )}
                {view === "supplier" && (
                  <SupplierView state={state} setState={setState} />
                )}
                {view === "staff" && (
                  <StaffView state={state} setState={setState} staffDirectory={staffDirectory} />
                )}
                {view === "menu" && (
                  <MenuManagerView state={state} setState={setState} categories={menuCategories} />
                )}
                {view === "settings" && (
                  <SettingsView
                    state={state}
                    setState={setState}
                    cloudConfig={cloudConfig}
                    setCloudConfig={setCloudConfig}
                    syncStatus={syncStatus}
                  />
                )}
              </section>
            </main>

            {receipt && <ReceiptModal receipt={receipt} settings={settings} onClose={() => setReceipt(null)} />}
          </div>
        );
      }

      function TablesView({ tables, orders, onOpenTable, onStatus, onTakeaway }) {
        const [filter, setFilter] = useState("All");
        const visibleTables = filter === "All" ? tables : tables.filter((table) => table.status === filter);
        const statusCounts = TABLE_STATUSES.reduce((acc, status) => {
          acc[status] = tables.filter((table) => table.status === status).length;
          return acc;
        }, {});

        return (
          <div className="h-full overflow-auto p-5">
            <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap gap-2">
                {["All", ...TABLE_STATUSES].map((status) => (
                  <button
                    key={status}
                    onClick={() => setFilter(status)}
                    className={cx(
                      "min-h-12 rounded-lg border px-4 text-sm font-semibold",
                      filter === status ? "border-orange bg-orange text-black" : "border-line bg-panel text-zinc-300"
                    )}
                  >
                    {status}
                    {status !== "All" && <span className="ml-2 text-xs opacity-75">{statusCounts[status]}</span>}
                  </button>
                ))}
              </div>
              <button
                onClick={onTakeaway}
                className="min-h-12 rounded-lg bg-orange px-5 font-bold text-black"
              >
                New Takeaway
              </button>
            </div>

            <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-5">
              {visibleTables.map((table) => {
                const order = orders.find((item) => item.id === table.orderId);
                const totals = order ? calcOrder(order) : null;
                return (
                  <div key={table.id} className="rounded-lg border border-line bg-panel p-4">
                    <button
                      data-testid={`table-${table.id}`}
                      onClick={() => onOpenTable(table.id)}
                      className="block min-h-36 w-full rounded-lg border border-white/5 bg-panel2 p-4 text-left active:scale-[.99]"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <div className="text-sm text-zinc-400">Table</div>
                          <div className="mt-1 text-4xl font-black">{table.id}</div>
                        </div>
                        <span className={cx("rounded-full border px-3 py-1 text-xs font-bold", statusClass(table.status))}>
                          {table.status}
                        </span>
                      </div>
                      <div className="mt-6 grid grid-cols-2 gap-2 text-sm">

      function KdsView({ tickets, onStatus, onArchive, onArchiveServed, onRemove }) {
        const [bellEnabled, setBellEnabled] = useState(false);
        const [showArchived, setShowArchived] = useState(false);
        const knownTicketsRef = useRef(new Set(tickets.map((ticket) => ticket.id)));
        const visibleTickets = tickets.filter((ticket) => !ticket.archived);
        const activeTickets = visibleTickets.filter((ticket) => ticket.status !== "Served");
        const servedTickets = visibleTickets.filter((ticket) => ticket.status === "Served");
        const archivedTickets = tickets.filter((ticket) => ticket.archived);

        useEffect(() => {
          const known = knownTicketsRef.current;
          const incoming = tickets.filter((ticket) => ticket.status === "New" && !known.has(ticket.id));
          if (bellEnabled && incoming.length > 0) playOrderBell();
          knownTicketsRef.current = new Set(tickets.map((ticket) => ticket.id));
        }, [tickets, bellEnabled]);

        function enableBell() {
          setBellEnabled(true);
          playOrderBell();
        }

        function removeTicket(ticket) {
          if (window.confirm(`Remove ${ticket.orderNumber} from KDS? Sales and payment records will stay.`)) {
            onRemove(ticket.id);
          }
        }

        return (
          <div className="h-full overflow-auto p-5">
            <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="text-2xl font-black">Kitchen Orders</h3>
                <div className="mt-1 text-sm text-zinc-400">
                  New tickets: {visibleTickets.filter((ticket) => ticket.status === "New").length} / Active: {activeTickets.length} / Archived: {archivedTickets.length}
                </div>
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={onArchiveServed}
                  disabled={servedTickets.length === 0}
                  className={cx(
                    "min-h-12 rounded-lg border px-4 text-sm font-black",
                    servedTickets.length
                      ? "border-line bg-panel text-zinc-200"
                      : "cursor-not-allowed border-line bg-ink text-zinc-600"
                  )}
                >
                  Archive Served
                </button>
                <button
                  onClick={() => setShowArchived((value) => !value)}
                  className={cx(
                    "min-h-12 rounded-lg border px-4 text-sm font-black",
                    showArchived
                      ? "border-sky-400/40 bg-sky-500/10 text-sky-200"
                      : "border-line bg-panel text-zinc-300"
                  )}
                >
                  {showArchived ? "Hide Archived" : "Show Archived"}
                </button>
                <button
                  onClick={enableBell}
                  className={cx(
                    "min-h-12 rounded-lg border px-4 text-sm font-black",
                    bellEnabled
                      ? "border-emerald-400/40 bg-emerald-500/10 text-emerald-200"
                      : "border-orange bg-orange text-black"
                  )}
                >
                  {bellEnabled ? "Bell Enabled" : "Enable Bell"}
                </button>
              </div>
            </div>
            <div className="grid grid-cols-1 gap-4 xl:grid-cols-4">
              {KDS_STATUSES.map((status) => {

                return (
                  <section key={status} className="min-h-[680px] rounded-lg border border-line bg-panel p-4">
                    <div className="mb-4 flex items-center justify-between">
                      <h3 className="text-xl font-black">{status}</h3>
                      <span className={cx("rounded-full border px-3 py-1 text-xs font-bold", statusClass(status))}>
                        {list.length}
                      </span>
                    </div>
                    <div className="space-y-3">
                      {list.map((ticket) => (
                        <div key={ticket.id} className="rounded-lg border border-line bg-ink p-4">
                          <div className="flex items-start justify-between gap-3">
                            <div>
                              <div className="text-lg font-black">{ticket.orderNumber}</div>
                              <div className="mt-1 text-sm text-zinc-400">
                                {ticket.tableId ? `Table ${ticket.tableId}` : "Takeaway"} / {displayTime(ticket.createdAt)}
                              </div>

                            <span className="rounded-md bg-white/5 px-2 py-1 text-xs text-zinc-400">

                                  <span className="text-xs text-zinc-500">{item.category}</span>
                                </div>
                                {item.note && <div className="mt-1 text-sm font-semibold text-orange2">{item.note}</div>}

                            ))}

                          <div className="mt-4 grid grid-cols-2 gap-2">
                            {KDS_STATUSES.filter((item) => item !== status).map((next) => (
                              <button

                          <div className="mt-3 grid grid-cols-2 gap-2">

            {showArchived && (

                <div className="mb-4 flex items-center justify-between">

                  {archivedTickets.map((ticket) => (
                    <div key={ticket.id} className="rounded-lg border border-line bg-ink p-4 opacity-80">
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <div className="font-black">{ticket.orderNumber}</div>
                          <div className="mt-1 text-xs text-zinc-500">
                            {ticket.tableId ? `Table ${ticket.tableId}` : "Takeaway"} / {displayTime(ticket.archivedAt || ticket.updatedAt || ticket.createdAt)}
                          </div>
                        </div>
                        <span className={cx("rounded-full border px-2 py-1 text-xs font-bold", statusClass(ticket.status))}>
                          {ticket.status}
                        </span>
                      </div>
                      <div className="mt-3 text-sm text-zinc-400">
                        {ticket.items.reduce((sum, item) => sum + item.qty, 0)} items

                      <div className="mt-3 grid grid-cols-2 gap-2">

                          onClick={() => onStatus(ticket.id, KDS_STATUSES.includes(ticket.status) ? ticket.status : "New")}

                      No archived tickets
                    </div>

              Active tickets: {activeTickets.length}. Served tickets on screen: {servedTickets.length}. Archived tickets: {archivedTickets.length}.

      function CashierView({ orders, selectedOrder, onSelect, onPayment, onCancel, onTables }) {
        const [method, setMethod] = useState("Cash");
        const [splitCount, setSplitCount] = useState(2);
        const [cashReceived, setCashReceived] = useState("");
        const [paymentRef, setPaymentRef] = useState("");
        const totals = calcOrder(selectedOrder);
        const splitQty = Math.max(1, Number(splitCount || 1));
        const perGuest = method === "Split Bill" ? totals.total / splitQty : totals.total;
        const cashTendered = Number(cashReceived || 0);
        const cashShort = method === "Cash" && cashTendered < totals.total;
        const changeDue = method === "Cash" ? Math.max(0, cashTendered - totals.total) : 0;
        const needsReference = method === "Card" || method === "PayNow / QR Pay";
        const canPay = Boolean(selectedOrder && selectedOrder.items.length > 0 && !cashShort);

        useEffect(() => {
          if (!selectedOrder?.id) {
            setCashReceived("");
            setPaymentRef("");
            return;
          }
          setCashReceived(calcOrder(selectedOrder).total.toFixed(2));
          setPaymentRef("");
        }, [selectedOrder?.id]);

        function submitPayment() {
          if (!canPay) return;
          onPayment(selectedOrder, method, method === "Split Bill" ? splitQty : 1, {
            tendered: method === "Cash" ? cashTendered : totals.total,
            changeDue,
            reference: needsReference ? paymentRef.trim() : method === "Split Bill" ? `${splitQty} ways` : "",
          });
        }

        function voidOrder() {
          if (!selectedOrder) return;
          const label = selectedOrder.tableId ? `Table ${selectedOrder.tableId}` : "Takeaway";
          if (window.confirm(`Cancel ${selectedOrder.number} (${label})? This will release the table and it will not count in Sales.`)) {
            onCancel(selectedOrder, "Wrong order cancelled before payment");
          }
        }

        return (
          <div className="grid h-full grid-cols-1 gap-5 overflow-auto p-5 xl:grid-cols-[420px_1fr]">
            <section className="rounded-lg border border-line bg-panel p-4">
              <div className="mb-4 flex items-center justify-between">
                <h3 className="text-xl font-black">Unpaid Orders</h3>
                <button
                  onClick={onTables}
                  className="min-h-10 rounded-md border border-line bg-ink px-3 text-sm font-bold"
                >
                  Tables
                </button>
              </div>
              <div className="space-y-3">
                {orders.map((order) => {
                  const orderTotal = calcOrder(order).total;
                  return (
                    <button
                      key={order.id}
                      onClick={() => onSelect(order.id)}
                      className={cx(
                        "w-full rounded-lg border p-4 text-left",
                        selectedOrder?.id === order.id ? "border-orange bg-orange/10" : "border-line bg-ink"
                      )}
                    >
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="text-lg font-black">{order.number}</div>
                          <div className="mt-1 text-sm text-zinc-400">
                            {order.tableId ? `Table ${order.tableId}` : "Takeaway"} / {order.status}
                          </div>
                        </div>
                        <div className="text-xl font-black text-orange2">{money(orderTotal)}</div>
                      </div>
                    </button>
                  );
                })}
                {orders.length === 0 && (
                  <div className="rounded-lg border border-dashed border-line p-6 text-center text-zinc-500">
                    No unpaid orders.
                  </div>
                )}
              </div>
            </section>

            <section className="rounded-lg border border-line bg-panel p-5">
              <div className="mb-5 flex items-start justify-between gap-3">
                <div>
                  <div className="text-sm font-semibold uppercase tracking-[.18em] text-zinc-500">Cashier</div>
                  <h3 className="mt-1 text-3xl font-black">{selectedOrder?.number || "Select order"}</h3>
                  <div className="mt-1 text-zinc-400">
                    {selectedOrder
                      ? `${selectedOrder.type}${selectedOrder.tableId ? ` / Table ${selectedOrder.tableId}` : ""}`
                      : "Choose an unpaid order to continue"}
                  </div>
                </div>
                {selectedOrder && (

      function ReportsView({ payments, supplierRecords }) {
        const [range, setRange] = useState("today");
        const [selectedDate, setSelectedDate] = useState(todayKey());
        const [selectedMonth, setSelectedMonth] = useState(monthKey());

        const filteredPayments = payments.filter((payment) => {
          if (range === "today") return payment.date === selectedDate;
          if (range === "month") return (payment.date || "").startsWith(selectedMonth);
          return true;
        });
        const filteredSupplierRecords = (supplierRecords || []).filter((record) => {
          if (range === "today") return record.date === selectedDate;
          if (range === "month") return (record.date || "").startsWith(selectedMonth);
          return true;
        });
        const todayPayments = payments.filter((payment) => payment.date === todayKey());
        const monthPayments = payments.filter((payment) => (payment.date || "").startsWith(monthKey()));
        const report = summarizePayments(filteredPayments);
        const todayReport = summarizePayments(todayPayments);
        const monthReport = summarizePayments(monthPayments);
        const supplierReport = summarizeSupplierRecords(filteredSupplierRecords);
        const average = report.orders ? report.total / report.orders : 0;
        const netFoodSales = Math.max(0, report.subtotal - report.discount);
        const directCostCategories = new Set(["Food Ingredients", "Packaging", "Beverage Stock"]);
        const directCosts = filteredSupplierRecords
          .filter((record) => directCostCategories.has(record.category))
          .reduce((sum, record) => sum + Number(record.amount || 0), 0);
        const grossProfit = netFoodSales - directCosts;
        const netProfit = report.total - supplierReport.total;

        const methodStats = PAYMENT_METHODS.reduce((acc, method) => {
          const methodPayments = filteredPayments.filter((payment) => payment.method === method);
          acc[method] = {
            total: methodPayments.reduce((sum, payment) => sum + Number(payment.total || 0), 0),
            count: methodPayments.length,
          };
          return acc;
        }, {});

        const itemStats = {};
        filteredPayments.forEach((payment) => {
          payment.items.forEach((item) => {
            if (!itemStats[item.name]) itemStats[item.name] = { name: item.name, qty: 0, sales: 0 };
            itemStats[item.name].qty += Number(item.qty || 0);
            itemStats[item.name].sales += Number(item.price || 0) * Number(item.qty || 0);
          });
        });
        const hotItems = Object.values(itemStats)
          .sort((a, b) => b.qty - a.qty)
          .slice(0, 6);

        const dailyMap = {};
        filteredPayments.forEach((payment) => {
          const key = payment.date || todayKey(payment.paidAt);
          if (!dailyMap[key]) dailyMap[key] = { date: key, total: 0, cost: 0, orders: 0 };
          dailyMap[key].total += Number(payment.total || 0);
          dailyMap[key].orders += 1;
        });
        filteredSupplierRecords.forEach((record) => {
          const key = record.date || todayKey(record.createdAt);
          if (!dailyMap[key]) dailyMap[key] = { date: key, total: 0, cost: 0, orders: 0 };
          dailyMap[key].cost += Number(record.amount || 0);
        });
        const dailyRows = Object.values(dailyMap)
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(-14);

        const maxMethod = Math.max(1, ...Object.values(methodStats).map((item) => item.total));
        const maxHot = Math.max(1, ...hotItems.map((item) => item.qty));
        const maxDaily = Math.max(1, ...dailyRows.map((item) => Math.max(item.total, item.cost)));

        function downloadSalesReportExcel() {
          const reportName = `sales-report-${rangeLabel(range, selectedDate, selectedMonth)}`;

                  record.method || "",
                  record.status || "",
                  record.amount || 0,
                  record.note || "",

              ],

        return (

                <button

                <button

            <div className="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-6">
              {[
                ["Today Sales", money(todayReport.total), `${todayReport.orders} orders today`],
                ["Month Sales", money(monthReport.total), `${monthReport.orders} orders this month`],
                ["Sales Collected", money(report.total), `${report.orders} paid orders`],
                ["Supplier Cost", money(supplierReport.total), `${filteredSupplierRecords.length} records`],

      function SupplierView({ state, setState }) {
        const suppliers = state.suppliers?.length ? state.suppliers : defaultSuppliers;
        const records = state.supplierRecords || [];
        const emptySupplierForm = { id: "", name: "", contact: "", category: SUPPLIER_CATEGORIES[0] };
        const emptyRecordForm = {
          id: "",
          supplierId: suppliers[0]?.id || "",
          category: SUPPLIER_CATEGORIES[0],
          date: todayKey(),
          amount: "",
          invoice: "",
          method: "Cash",
          status: "Paid",
          note: "",
        };
        const [supplierForm, setSupplierForm] = useState(emptySupplierForm);
        const [recordForm, setRecordForm] = useState(emptyRecordForm);
        const [range, setRange] = useState("month");
        const [selectedDate, setSelectedDate] = useState(todayKey());
        const [selectedMonth, setSelectedMonth] = useState(monthKey());
        const editingSupplier = Boolean(supplierForm.id);
        const editingRecord = Boolean(recordForm.id);

        useEffect(() => {
          if (!suppliers.find((supplier) => supplier.id === recordForm.supplierId)) {
            setRecordForm((current) => ({
              ...current,
              supplierId: suppliers[0]?.id || "",
              category: suppliers[0]?.category || SUPPLIER_CATEGORIES[0],
            }));
          }
        }, [suppliers, recordForm.supplierId]);

        const filteredRecords = records.filter((record) => {
          if (range === "today") return record.date === selectedDate;
          if (range === "month") return (record.date || "").startsWith(selectedMonth);
          return true;
        });
        const supplierSummary = summarizeSupplierRecords(filteredRecords);
        const categoryRows = Object.entries(supplierSummary.byCategory)
          .map(([category, total]) => ({ category, total }))
          .sort((a, b) => b.total - a.total);
        const maxCategory = Math.max(1, ...categoryRows.map((row) => row.total));
        const recentRecords = [...filteredRecords].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

        function supplierName(id) {
          return suppliers.find((supplier) => supplier.id === id)?.name || "Unknown Supplier";

        function saveSupplier() {
          if (!supplierForm.name.trim()) return;
          const supplier = {
            id: supplierForm.id || uid("supplier"),
            name: supplierForm.name.trim(),
            contact: supplierForm.contact.trim(),
            category: supplierForm.category || SUPPLIER_CATEGORIES[0],
          };
          setState((current) => ({
            ...current,
            suppliers: editingSupplier
              ? (current.suppliers || suppliers).map((item) => (item.id === supplier.id ? supplier : item))
              : [supplier, ...(current.suppliers || suppliers)],
            supplierRecords: (current.supplierRecords || []).map((record) =>
              record.supplierId === supplier.id ? { ...record, supplierName: supplier.name } : record
            ),
          }));
          setSupplierForm(emptySupplierForm);
          if (!recordForm.supplierId) {
            setRecordForm((current) => ({ ...current, supplierId: supplier.id, category: supplier.category }));
          }
        }

        function deleteSupplier(id) {
          const nextSuppliers = suppliers.filter((supplier) => supplier.id !== id);
          if (nextSuppliers.length === 0) return;
          setState((current) => ({
            ...current,
            suppliers: (current.suppliers || suppliers).filter((supplier) => supplier.id !== id),
          }));
          if (supplierForm.id === id) setSupplierForm(emptySupplierForm);
          if (recordForm.supplierId === id) {
            setRecordForm((current) => ({
              ...current,
              supplierId: nextSuppliers[0].id,
              category: nextSuppliers[0].category,
            }));
          }

        function saveRecord() {

          const record = {
            id: recordForm.id || uid("cost"),

          setState((current) => ({

            category: record.category,
            date: record.date,
          });

            ...current,
            supplierRecords: (current.supplierRecords || []).filter((record) => record.id !== id),

      function StaffView({ state, setState, staffDirectory }) {
        const [selectedStaffId, setSelectedStaffId] = useState(staffDirectory[0].id);
        const [attendanceRange, setAttendanceRange] = useState("today");
        const [attendanceDate, setAttendanceDate] = useState(todayKey());
        const emptyStaffForm = { id: "", name: "", role: "Server", pin: "" };
        const emptyLeaveForm = {
          id: "",
          staffId: staffDirectory[0]?.id || "",
          type: LEAVE_TYPES[0],
          startDate: todayKey(),
          endDate: todayKey(),
          status: "Pending",
          reason: "",
        };
        const [staffForm, setStaffForm] = useState(emptyStaffForm);
        const [leaveForm, setLeaveForm] = useState(emptyLeaveForm);
        const [leaveRange, setLeaveRange] = useState("month");
        const [leaveDate, setLeaveDate] = useState(todayKey());
        const editingStaff = Boolean(staffForm.id);
        const editingLeave = Boolean(leaveForm.id);
        const selectedStaff = staffDirectory.find((staff) => staff.id === selectedStaffId) || staffDirectory[0];
        const leaveRequests = state.leaveRequests || [];
        const todayCards = state.timecards.filter((card) => card.date === todayKey());
        const onDuty = todayCards.filter((card) => !card.clockOut);
        const monthCards = state.timecards.filter((card) => (card.date || "").startsWith(monthKey()));
        const todayHours = todayCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const monthHours = monthCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const leaveMonth = leaveDate.slice(0, 7);
        const leaveReportRows = leaveRequests
          .filter((request) => {
            const start = request.startDate || todayKey();
            const end = request.endDate || start;
            if (leaveRange === "today") return start <= leaveDate && end >= leaveDate;
            if (leaveRange === "month") return start <= `${leaveMonth}-31` && end >= `${leaveMonth}-01`;
            return true;
          })
          .sort((a, b) => new Date(b.startDate || b.createdAt).getTime() - new Date(a.startDate || a.createdAt).getTime());
        const leaveTotalDays = leaveReportRows.reduce((sum, request) => sum + leaveDays(request.startDate, request.endDate), 0);
        const leaveApprovedDays = leaveReportRows
          .filter((request) => request.status === "Approved")
          .reduce((sum, request) => sum + leaveDays(request.startDate, request.endDate), 0);
        const leavePendingCount = leaveReportRows.filter((request) => request.status === "Pending").length;
        const leaveSummaryRows = staffDirectory.map((staff) => {
          const staffLeaves = leaveReportRows.filter((request) => request.staffId === staff.id);
          return {
            ...staff,
            requests: staffLeaves.length,
            approvedDays: staffLeaves
              .filter((request) => request.status === "Approved")
              .reduce((sum, request) => sum + leaveDays(request.startDate, request.endDate), 0),
            pending: staffLeaves.filter((request) => request.status === "Pending").length,
          };
        });
        const attendanceMonth = attendanceDate.slice(0, 7);
        const attendanceCards = state.timecards
          .filter((card) => {
            if (attendanceRange === "today") return card.date === attendanceDate;
            if (attendanceRange === "month") return (card.date || "").startsWith(attendanceMonth);
            return true;
          })
          .sort((a, b) => new Date(b.clockIn || b.date).getTime() - new Date(a.clockIn || a.date).getTime());
        const attendanceTotalHours = attendanceCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const attendanceOpenShifts = attendanceCards.filter((card) => !card.clockOut).length;
        const attendanceStaffRows = staffDirectory.map((staff) => {
          const staffCards = attendanceCards.filter((card) => card.staffId === staff.id);
          return {
            ...staff,
            shifts: staffCards.length,
            hours: staffCards.reduce((sum, card) => sum + shiftHours(card), 0),
            onDuty: staffCards.some((card) => !card.clockOut),
          };
        });
        const staffHourRows = staffDirectory.map((staff) => {
          const staffToday = todayCards.filter((card) => card.staffId === staff.id);
          const staffMonth = monthCards.filter((card) => card.staffId === staff.id);
          return {
            ...staff,
            todayHours: staffToday.reduce((sum, card) => sum + shiftHours(card), 0),
            monthHours: staffMonth.reduce((sum, card) => sum + shiftHours(card), 0),
            onDuty: staffToday.some((card) => !card.clockOut),
          };
        });

        useEffect(() => {
          if (!staffDirectory.find((staff) => staff.id === selectedStaffId)) {
            setSelectedStaffId(staffDirectory[0]?.id || "");
          }
          if (!staffDirectory.find((staff) => staff.id === leaveForm.staffId)) {
            setLeaveForm((current) => ({ ...current, staffId: staffDirectory[0]?.id || "" }));
          }
        }, [staffDirectory, selectedStaffId]);

        function saveStaff() {
          if (!staffForm.name.trim() || !staffForm.pin.trim()) return;
          const nextStaff = {
            id: staffForm.id || uid("staff"),
            name: staffForm.name.trim(),
            role: staffForm.role.trim() || "Server",
            pin: staffForm.pin.trim(),
          };
          setState((current) => saveStaffToState(current, nextStaff, editingStaff));
          setSelectedStaffId(nextStaff.id);
          setStaffForm(emptyStaffForm);
        }

        function deleteStaff(id) {
          setState((current) => deleteStaffFromState(current, id));
          if (selectedStaffId === id) setSelectedStaffId(staffDirectory.find((staff) => staff.id !== id)?.id || "");
          if (staffForm.id === id) setStaffForm(emptyStaffForm);
        }

        function clock(type) {
          const now = new Date().toISOString();
          setState((current) => {
            const open = current.timecards.find(
              (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !open) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: selectedStaff.id,
                    staffName: selectedStaff.name,
                    role: selectedStaff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,
                  },
                  ...current.timecards,
                ],
              };
            }
            if (type === "out" && open) {
              return {
                ...current,
                timecards: current.timecards.map((card) =>
                  card.id === open.id ? { ...card, clockOut: now } : card
                ),
              };
            }
            return current;
          });

          const staff = staffDirectory.find((item) => item.id === leaveForm.staffId) || staffDirectory[0];
          if (!staff || !leaveForm.startDate) return;
          const startDate = leaveForm.startDate;
          const endDate = leaveForm.endDate && leaveForm.endDate >= startDate ? leaveForm.endDate : startDate;
          const request = {
            id: leaveForm.id || uid("leave"),
            staffId: staff.id,
            staffName: staff.name,
            role: staff.role,
            type: leaveForm.type,
            startDate,
            endDate,
            days: leaveDays(startDate, endDate),
            status: leaveForm.status,
            reason: leaveForm.reason.trim(),
            createdAt: leaveForm.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            leaveRequests: editingLeave
              ? (current.leaveRequests || []).map((item) => (item.id === request.id ? request : item))
              : [request, ...(current.leaveRequests || [])],
          }));
          setLeaveForm({ ...emptyLeaveForm, staffId: staff.id, startDate, endDate });
        }

          setState((current) => ({
            ...current,
            leaveRequests: (current.leaveRequests || []).map((request) =>
              request.id === id ? { ...request, status, updatedAt: new Date().toISOString() } : request
            ),
          }));
        }

          setState((current) => ({
            ...current,
            leaveRequests: (current.leaveRequests || []).filter((request) => request.id !== id),

          if (leaveForm.id === id) setLeaveForm(emptyLeaveForm);

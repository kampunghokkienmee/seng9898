<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>某招牌麵館 POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#07090d",
              panel: "#11151d",
              panel2: "#171c26",
              line: "#2a3140",
              orange: "#ff8a2a",
              orange2: "#ffb067",
            },
            boxShadow: {
              soft: "0 18px 60px rgba(0,0,0,.28)",
            },
          },
        },
      };
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #07090d;
        color: #f7f8fb;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      @media print {
        body.receipt-printing {
          background: #fff;
          color: #111;
        }

        body.receipt-printing * {
          visibility: hidden !important;
        }

        body.receipt-printing #receipt-print-area,
        body.receipt-printing #receipt-print-area * {
          visibility: visible !important;
        }

        body.receipt-printing #receipt-print-area {
          position: fixed;
          inset: 0 auto auto 0;
          width: 80mm;
          max-width: none;
          border: 0 !important;
          border-radius: 0 !important;
          box-shadow: none !important;
          background: #fff !important;
          color: #111 !important;
        }

        body.receipt-printing #receipt-print-area * {
          background: transparent !important;
          color: #111 !important;
          border-color: #ddd !important;
        }

        body.receipt-printing .screen-only {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-plugins="transform-react-jsx">
      const { useEffect, useMemo, useRef, useState } = React;

      const STORAGE_KEY = "aurora-ipad-pos-state-v1";
      const SESSION_KEY = "aurora-ipad-pos-session-v1";
      const CLOUD_CONFIG_KEY = "aurora-ipad-pos-cloud-config-v1";
      const DEVICE_ID_KEY = "aurora-ipad-pos-device-id-v1";
      const MENU_VERSION = "chinese-noodle-v1";
      const SETTINGS_VERSION = "signature-noodle-house-v1";
      const TAX_RATE = 0.09;
      const SERVICE_RATE = 0.1;
      const CATEGORIES = ["中式麵食", "炒麵", "飲品", "加料"];
      const ORDER_NOTES = ["No spicy", "Less ice", "No onion"];
      const PAYMENT_METHODS = ["Cash", "Card", "PayNow / QR Pay", "Split Bill"];
      const KDS_STATUSES = ["New", "Preparing", "Ready", "Served"];
      const TABLE_STATUSES = ["Available", "Occupied", "Reserved", "Cleaning"];
      const SUPPLIER_CATEGORIES = [
        "Food Ingredients",
        "Packaging",
        "Beverage Stock",
        "Utilities",
        "Rent",
        "Salary",
        "Repair",
        "Other",
      ];
      const SUPPLIER_PAYMENT_METHODS = ["Cash", "Card", "Bank Transfer", "PayNow / QR Pay", "Credit"];
      const SUPPLIER_STATUSES = ["Paid", "Unpaid"];

      const image = (id) =>
        `https://images.unsplash.com/${id}?auto=format&fit=crop&w=700&q=80`;

      const defaultSettings = {
        businessName: "某招牌麵館",
        tagline: "iPad Restaurant POS",
        managerName: "Manager",
        managerPin: "0000",
      };

      const defaultCloudConfig = {
        enabled: false,
        restaurantId: "signature-noodle-house",
        apiKey: "",
        authDomain: "",
        databaseURL: "",
        projectId: "",
        appId: "",
      };

      const defaultStaffDirectory = [
        { id: "s1", name: "Alicia Tan", role: "Cashier", pin: "1111" },
        { id: "s2", name: "Ben Lim", role: "Server", pin: "2222" },
        { id: "s3", name: "Chloe Ng", role: "Barista", pin: "3333" },
        { id: "s4", name: "Daniel Koh", role: "Kitchen", pin: "4444" },
      ];

      const defaultSuppliers = [
        { id: "sup1", name: "Fresh Noodle Supplier", contact: "", category: "Food Ingredients" },
        { id: "sup2", name: "Seafood & Prawn Stock", contact: "", category: "Food Ingredients" },
        { id: "sup3", name: "Packaging Supplier", contact: "", category: "Packaging" },
      ];

      const defaultMenu = [
        {
          id: "cn1",
          name: "檳城福建面",
          category: "中式麵食",
          price: 8.9,
          popular: true,
          soldOut: false,
          image: image("photo-1569718212165-3a8278d5f624"),
        },
        {
          id: "cn2",
          name: "葱油面",
          category: "中式麵食",
          price: 7.5,
          popular: true,
          soldOut: false,
          image: image("photo-1612929633738-8fe44f7ec841"),
        },
        {
          id: "cn3",
          name: "麻辣葱油面",
          category: "中式麵食",
          price: 8.5,
          popular: true,
          soldOut: false,
          image: image("photo-1591814468924-caf88d1232e1"),
        },
        {
          id: "cn4",
          name: "福建炒蝦麵",
          category: "炒麵",
          price: 12.9,
          popular: true,
          soldOut: false,
          image: image("photo-1512058564366-18510be2db19"),
        },
      ];

      const navItems = [
        { id: "tables", label: "Tables", icon: "T", managerOnly: false },
        { id: "pos", label: "Order", icon: "O", managerOnly: false },
        { id: "kds", label: "KDS", icon: "K", managerOnly: false },
        { id: "cashier", label: "Cashier", icon: "$", managerOnly: false },
        { id: "reports", label: "Sales", icon: "S", managerOnly: true },
        { id: "supplier", label: "Supplier", icon: "B", managerOnly: true },
        { id: "staff", label: "Staff", icon: "P", managerOnly: true },
        { id: "menu", label: "Menu", icon: "M", managerOnly: true },
        { id: "settings", label: "Setup", icon: "G", managerOnly: true },
      ];

      function uid(prefix = "id") {
        return `${prefix}-${Math.random().toString(36).slice(2, 9)}-${Date.now().toString(36)}`;
      }

      function todayKey(date = new Date()) {
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return localDate.toISOString().slice(0, 10);
      }

      function displayTime(value = new Date()) {
        return new Intl.DateTimeFormat("en-SG", {
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(value));
      }

      function displayDateTime(value = new Date()) {
        return new Intl.DateTimeFormat("en-SG", {
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        }).format(new Date(value));
      }

      function displayDate(value = new Date()) {
        return new Intl.DateTimeFormat("en-SG", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        }).format(new Date(value));
      }

      function monthKey(value = new Date()) {
        return todayKey(new Date(value)).slice(0, 7);
      }

      function money(value) {
        return new Intl.NumberFormat("en-SG", {
          style: "currency",
          currency: "SGD",
          minimumFractionDigits: 2,
        }).format(Number(value || 0));
      }

      function roundCurrency(value) {
        return Math.round(Number(value || 0) * 100) / 100;
      }

      function shiftHours(card) {
        if (!card?.clockIn) return 0;
        const start = new Date(card.clockIn).getTime();
        const end = card.clockOut ? new Date(card.clockOut).getTime() : Date.now();
        return Math.max(0, (end - start) / 3600000);
      }

      function formatHours(value) {
        return `${Number(value || 0).toFixed(1)}h`;
      }

      function summarizePayments(payments) {
        return payments.reduce(
          (acc, payment) => {
            acc.orders += 1;
            acc.subtotal += Number(payment.subtotal || 0);
            acc.service += Number(payment.service || 0);
            acc.gst += Number(payment.gst || 0);
            acc.discount += Number(payment.discount || 0);
            acc.total += Number(payment.total || 0);
            return acc;
          },
          { orders: 0, subtotal: 0, service: 0, gst: 0, discount: 0, total: 0 }
        );
      }

      let bellAudioContext = null;

      function playOrderBell() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          if (!bellAudioContext) bellAudioContext = new AudioContext();
          if (bellAudioContext.state === "suspended") bellAudioContext.resume();

          [0, 140, 300].forEach((delay, index) => {
            setTimeout(() => {
              const oscillator = bellAudioContext.createOscillator();
              const gain = bellAudioContext.createGain();
              oscillator.type = "sine";
              oscillator.frequency.setValueAtTime(index === 1 ? 980 : 760, bellAudioContext.currentTime);
              gain.gain.setValueAtTime(0.0001, bellAudioContext.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.2, bellAudioContext.currentTime + 0.02);
              gain.gain.exponentialRampToValueAtTime(0.0001, bellAudioContext.currentTime + 0.16);
              oscillator.connect(gain);
              gain.connect(bellAudioContext.destination);
              oscillator.start();
              oscillator.stop(bellAudioContext.currentTime + 0.18);
            }, delay);
          });
        } catch (error) {
          // Audio can be blocked until the user taps Enable Bell.
        }
      }

      function summarizeSupplierRecords(records) {
        return records.reduce(
          (acc, record) => {
            const amount = Number(record.amount || 0);
            acc.total += amount;
            if (record.status === "Unpaid") acc.unpaid += amount;
            else acc.paid += amount;
            if (!acc.byCategory[record.category]) acc.byCategory[record.category] = 0;
            acc.byCategory[record.category] += amount;
            return acc;
          },
          { total: 0, paid: 0, unpaid: 0, byCategory: {} }
        );
      }

      function seedTables() {
        return Array.from({ length: 20 }, (_, index) => ({
          id: index + 1,
          status: "Available",
          orderId: null,
        }));
      }

      function cleanMenu(items) {
        return items.map((item) => ({
          popular: false,
          soldOut: false,
          ...item,
          price: Number(item.price || 0),
        }));
      }

      function saveStaffToState(current, nextStaff, editingStaff) {
        const staffList = current.staff?.length ? current.staff : defaultStaffDirectory;
        return {
          ...current,
          staff: editingStaff
            ? staffList.map((staff) => (staff.id === nextStaff.id ? nextStaff : staff))
            : [nextStaff, ...staffList],
          timecards: (current.timecards || []).map((card) =>
            card.staffId === nextStaff.id
              ? { ...card, staffName: nextStaff.name, role: nextStaff.role }
              : card
          ),
        };
      }

      function deleteStaffFromState(current, id) {
        const staffList = current.staff?.length ? current.staff : defaultStaffDirectory;
        if (staffList.length <= 1) return current;
        return {
          ...current,
          staff: staffList.filter((staff) => staff.id !== id),
        };
      }

      function emptyState() {
        return {
          menuVersion: MENU_VERSION,
          settingsVersion: SETTINGS_VERSION,
          settings: { ...defaultSettings },
          staff: defaultStaffDirectory.map((staff) => ({ ...staff })),
          tables: seedTables(),
          menuItems: cleanMenu(defaultMenu),
          orders: [],
          kitchenTickets: [],
          payments: [],
          suppliers: defaultSuppliers.map((supplier) => ({ ...supplier })),
          supplierRecords: [],
          timecards: [],
        };
      }

      function hydrateState(saved) {
        if (!saved) return emptyState();
        const shouldUseDefaultMenu = saved.menuVersion !== MENU_VERSION;
        const shouldUseDefaultSettings = saved.settingsVersion !== SETTINGS_VERSION;
        return {
          ...emptyState(),
          ...saved,
          menuVersion: MENU_VERSION,
          settingsVersion: SETTINGS_VERSION,
          settings: shouldUseDefaultSettings
            ? { ...defaultSettings, ...(saved.settings || {}), businessName: defaultSettings.businessName }
            : { ...defaultSettings, ...(saved.settings || {}) },
          staff: saved.staff?.length ? saved.staff : defaultStaffDirectory.map((staff) => ({ ...staff })),
          tables: saved.tables?.length === 20 ? saved.tables : seedTables(),
          menuItems: cleanMenu(shouldUseDefaultMenu ? defaultMenu : saved.menuItems?.length ? saved.menuItems : defaultMenu),
          orders: saved.orders || [],
          kitchenTickets: saved.kitchenTickets || [],
          payments: saved.payments || [],
          suppliers: saved.suppliers?.length ? saved.suppliers : defaultSuppliers.map((supplier) => ({ ...supplier })),
          supplierRecords: saved.supplierRecords || [],
          timecards: saved.timecards || [],
        };
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return hydrateState(saved);
        } catch (error) {
          return emptyState();
        }
      }

      function loadCloudConfig() {
        try {
          const saved = JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY));
          return { ...defaultCloudConfig, ...(saved || {}) };
        } catch (error) {
          return { ...defaultCloudConfig };
        }
      }

      function getDeviceId() {
        const saved = localStorage.getItem(DEVICE_ID_KEY);
        if (saved) return saved;
        const next = uid("device");
        localStorage.setItem(DEVICE_ID_KEY, next);
        return next;
      }

      function sanitizeCloudPath(value) {
        return String(value || "default-store")
          .trim()
          .replace(/[.#$/[\]]/g, "-")
          .replace(/\s+/g, "-")
          .slice(0, 80) || "default-store";
      }

      function hasCloudConfig(config) {
        return Boolean(
          config?.enabled &&
          config.apiKey?.trim() &&
          config.databaseURL?.trim() &&
          config.projectId?.trim() &&
          config.restaurantId?.trim()
        );
      }

      function cloudStatePath(config) {
        return `restaurants/${sanitizeCloudPath(config.restaurantId)}/posState`;
      }

      function firebaseOptions(config) {
        return {
          apiKey: config.apiKey.trim(),
          authDomain: config.authDomain.trim() || undefined,
          databaseURL: config.databaseURL.trim(),
          projectId: config.projectId.trim(),
          appId: config.appId.trim() || undefined,
        };
      }

      function calcOrder(order) {
        const subtotal = roundCurrency((order?.items || []).reduce((sum, item) => sum + item.price * item.qty, 0));
        const discount = roundCurrency(order?.discount || 0);
        const service = roundCurrency(subtotal * SERVICE_RATE);
        const gst = roundCurrency((subtotal + service - discount) * TAX_RATE);
        const total = roundCurrency(Math.max(0, subtotal + service + gst - discount));
        return { subtotal, service, gst, discount, total };
      }

      function statusClass(status) {
        const map = {
          Available: "border-emerald-400/40 bg-emerald-500/10 text-emerald-200",
          Occupied: "border-orange/50 bg-orange/15 text-orange2",
          Reserved: "border-sky-400/40 bg-sky-500/10 text-sky-200",
          Cleaning: "border-violet-400/40 bg-violet-500/10 text-violet-200",
          Open: "border-orange/50 bg-orange/15 text-orange2",
          Held: "border-amber-400/40 bg-amber-500/10 text-amber-200",
          Sent: "border-sky-400/40 bg-sky-500/10 text-sky-200",
          Paid: "border-emerald-400/40 bg-emerald-500/10 text-emerald-200",
          New: "border-orange/50 bg-orange/15 text-orange2",
          Preparing: "border-sky-400/40 bg-sky-500/10 text-sky-200",
          Ready: "border-emerald-400/40 bg-emerald-500/10 text-emerald-200",
          Served: "border-zinc-500/40 bg-zinc-500/10 text-zinc-300",
        };
        return map[status] || "border-line bg-white/5 text-zinc-300";
      }

      function cx(...classes) {
        return classes.filter(Boolean).join(" ");
      }

      function LoginScreen({ state, setState, onLogin }) {
        const [mode, setMode] = useState("staff");
        const staffDirectory = state.staff?.length ? state.staff : defaultStaffDirectory;
        const settings = { ...defaultSettings, ...(state.settings || {}) };
        const [staffId, setStaffId] = useState(staffDirectory[0].id);
        const [pin, setPin] = useState("");
        const [message, setMessage] = useState("");

        const selectedStaff = staffDirectory.find((staff) => staff.id === staffId) || staffDirectory[0];
        const activeCard = state.timecards.find(
          (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
        );

        useEffect(() => {
          if (!staffDirectory.find((staff) => staff.id === staffId)) {
            setStaffId(staffDirectory[0]?.id || "");
          }
        }, [staffDirectory, staffId]);

        function submitLogin() {
          const user =
            mode === "manager"
              ? pin === settings.managerPin
                ? { id: "manager", name: settings.managerName, role: "manager" }
                : null
              : staffDirectory.find((item) => item.id === staffId && item.pin === pin);
          if (!user) {
            setMessage("Wrong PIN. You can edit staff PINs and manager PIN in Setup after manager login.");
            return;
          }
          const session =
            mode === "manager"
              ? { id: user.id, name: user.name, role: "manager" }
              : { id: user.id, name: user.name, role: "staff", title: user.role };
          localStorage.setItem(SESSION_KEY, JSON.stringify(session));
          onLogin(session);
        }

        function resetDemo() {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SESSION_KEY);
          setState(emptyState());
          setPin("");
          setMessage("Demo data reset. You can start a fresh test now.");
        }

        function clock(type) {
          const now = new Date().toISOString();
          setState((current) => {
            const openCard = current.timecards.find(
              (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !openCard) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: selectedStaff.id,
                    staffName: selectedStaff.name,
                    role: selectedStaff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,
                  },
                  ...current.timecards,
                ],
              };
            }
            if (type === "out" && openCard) {
              return {
                ...current,
                timecards: current.timecards.map((card) =>
                  card.id === openCard.id ? { ...card, clockOut: now } : card
                ),
              };
            }
            return current;
          });
          setMessage(type === "in" ? `${selectedStaff.name} clocked in.` : `${selectedStaff.name} clocked out.`);
        }

        return (
          <main className="min-h-screen bg-ink text-white">
            <section className="mx-auto grid min-h-screen max-w-6xl grid-cols-1 items-center gap-8 px-6 py-8 lg:grid-cols-[1.1fr_.9fr]">
              <div className="space-y-8">
                <div>
                  <div className="mb-5 inline-flex rounded-full border border-orange/40 bg-orange/10 px-4 py-2 text-sm font-semibold text-orange2">
                    {settings.tagline}
                  </div>
                  <h1 className="max-w-3xl text-5xl font-semibold leading-tight tracking-normal text-white">
                    {settings.businessName}
                  </h1>
                  <p className="mt-5 max-w-2xl text-lg leading-8 text-zinc-300">
                    Touch-first restaurant, cafe, and snack bar POS with tables, menu ordering, KDS,
                    simulated payments, sales reporting, staff clocking, and menu management.
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  {[
                    ["Tables", "20 dine-in tables with live status"],
                    ["Kitchen", "KDS ticket flow from New to Served"],
                    ["Payment", "Cash, Card, PayNow, QR Pay, Split Bill"],
                    ["Reports", "Daily sales, hot items, tender mix"],
                  ].map(([title, copy]) => (
                    <div key={title} className="rounded-lg border border-line bg-panel/80 p-5">
                      <div className="text-lg font-semibold">{title}</div>
                      <div className="mt-2 text-sm leading-6 text-zinc-400">{copy}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="rounded-lg border border-line bg-panel p-5 shadow-soft">
                <div className="mb-5 grid grid-cols-2 rounded-lg bg-ink p-1">
                  {["staff", "manager"].map((item) => (
                    <button
                      key={item}
                      onClick={() => {
                        setMode(item);
                        setPin("");
                        setMessage("");
                      }}
                      className={cx(
                        "min-h-14 rounded-md text-base font-semibold capitalize transition",
                        mode === item ? "bg-orange text-black" : "text-zinc-300"
                      )}
                    >
                      {item === "staff" ? "Staff Login" : "Manager Login"}
                    </button>
                  ))}
                </div>

                {mode === "staff" && (
                  <div className="mb-4 space-y-3">
                    <label className="text-sm font-semibold text-zinc-400">Staff</label>
                    <select
                      value={staffId}
                      onChange={(event) => setStaffId(event.target.value)}
                      className="min-h-14 w-full rounded-lg border border-line bg-ink px-4 text-lg text-white outline-none focus:border-orange"
                    >
                      {staffDirectory.map((staff) => (
                        <option key={staff.id} value={staff.id}>
                          {staff.name} - {staff.role}
                        </option>
                      ))}
                    </select>
                    <div className="grid grid-cols-2 gap-3">
                      <button
                        onClick={() => clock("in")}
                        className="min-h-14 rounded-lg border border-emerald-400/30 bg-emerald-500/10 font-semibold text-emerald-200"
                      >
                        Clock In
                      </button>
                      <button
                        onClick={() => clock("out")}
                        className="min-h-14 rounded-lg border border-zinc-500/40 bg-white/5 font-semibold text-zinc-200"
                      >
                        Clock Out
                      </button>
                    </div>
                    <div className="rounded-lg border border-line bg-ink p-3 text-sm text-zinc-400">
                      Status:{" "}
                      <span className={activeCard ? "font-semibold text-emerald-300" : "font-semibold text-zinc-200"}>
                        {activeCard ? `On duty since ${displayTime(activeCard.clockIn)}` : "Not clocked in"}
                      </span>
                    </div>
                  </div>
                )}

                <label className="text-sm font-semibold text-zinc-400">PIN</label>
                <input
                  value={pin}
                  onChange={(event) => setPin(event.target.value)}
                  onKeyDown={(event) => {
                    if (event.key === "Enter") submitLogin();
                  }}
                  inputMode="numeric"
                  type="password"
                  placeholder={mode === "manager" ? "Manager PIN 0000" : "Staff PIN"}
                  className="mt-2 min-h-16 w-full rounded-lg border border-line bg-ink px-5 text-2xl tracking-[.35em] text-white outline-none focus:border-orange"
                />
                <button
                  onClick={submitLogin}
                  className="mt-4 min-h-16 w-full rounded-lg bg-orange px-5 text-lg font-bold text-black transition active:scale-[.99]"
                >
                  Enter POS
                </button>
                <button
                  onClick={resetDemo}
                  className="mt-3 min-h-12 w-full rounded-lg border border-line bg-ink px-5 text-sm font-bold text-zinc-300 transition active:scale-[.99]"
                >
                  Reset Demo Data
                </button>
                <p className="mt-4 min-h-10 text-sm leading-6 text-zinc-400">{message}</p>
              </div>
            </section>
          </main>
        );
      }

      function AppShell({ user, setUser, state, setState, cloudConfig, setCloudConfig, syncStatus }) {
        const settings = { ...defaultSettings, ...(state.settings || {}) };
        const staffDirectory = state.staff?.length ? state.staff : defaultStaffDirectory;
        const [view, setView] = useState("tables");
        const [selectedTableId, setSelectedTableId] = useState(1);
        const [activeOrderId, setActiveOrderId] = useState(null);
        const [selectedOrderId, setSelectedOrderId] = useState(null);
        const [receipt, setReceipt] = useState(null);

        const openOrders = state.orders.filter((order) => order.status !== "Paid");
        const activeOrder = state.orders.find((order) => order.id === activeOrderId) || null;
        const selectedOrder = state.orders.find((order) => order.id === selectedOrderId) || activeOrder || openOrders[0] || null;
        const todayPayments = state.payments.filter((payment) => payment.date === todayKey());
        const onDuty = state.timecards.filter((card) => card.date === todayKey() && !card.clockOut);
        const syncTone =
          syncStatus.kind === "online"
            ? "border-emerald-400/30 bg-emerald-500/10 text-emerald-200"
            : syncStatus.kind === "error"
            ? "border-rose-400/30 bg-rose-500/10 text-rose-200"
            : syncStatus.kind === "syncing" || syncStatus.kind === "connecting"
            ? "border-sky-400/30 bg-sky-500/10 text-sky-200"
            : "border-line bg-panel text-zinc-300";

        function logout() {
          localStorage.removeItem(SESSION_KEY);
          setUser(null);
        }

        function resetDemo() {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(SESSION_KEY);
          setState(emptyState());
          setActiveOrderId(null);
          setSelectedOrderId(null);
          setReceipt(null);
          setSelectedTableId(1);
          setView("tables");
          setUser(null);
        }

        function createOrderForTable(tableId) {
          const table = state.tables.find((item) => item.id === tableId);
          setSelectedTableId(tableId);
          if (table?.orderId) {
            const existing = state.orders.find((order) => order.id === table.orderId);
            if (existing) {
              setActiveOrderId(existing.id);
              setSelectedOrderId(existing.id);
              setView("pos");
              return;
            }
          }

          const order = {
            id: uid("order"),
            number: `T${String(tableId).padStart(2, "0")}-${Date.now().toString().slice(-4)}`,
            type: "Dine In",
            tableId,
            items: [],
            discount: 0,
            status: "Open",
            createdAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            tables: current.tables.map((item) =>
              item.id === tableId ? { ...item, status: "Occupied", orderId: order.id } : item
            ),
            orders: [order, ...current.orders],
          }));
          setActiveOrderId(order.id);
          setSelectedOrderId(order.id);
          setView("pos");
        }

        function createTakeawayOrder() {
          const order = {
            id: uid("order"),
            number: `TA-${Date.now().toString().slice(-5)}`,
            type: "Takeaway",
            tableId: null,
            items: [],
            discount: 0,
            status: "Open",
            createdAt: new Date().toISOString(),
          };
          setState((current) => ({ ...current, orders: [order, ...current.orders] }));
          setActiveOrderId(order.id);
          setSelectedOrderId(order.id);
          setView("pos");
        }

        function updateTableStatus(tableId, status) {
          setState((current) => ({
            ...current,
            tables: current.tables.map((table) => {
              if (table.id !== tableId) return table;
              if (status === "Available") return { ...table, status, orderId: null };
              return { ...table, status };
            }),
          }));
        }

        function addItem(menuItem) {
          if (menuItem.soldOut) return;
          let orderId = activeOrderId;

          setState((current) => {
            let orders = current.orders;
            let tables = current.tables;
            let order = orders.find((item) => item.id === orderId);

            if (!order) {
              const tableId = selectedTableId || 1;
              order = {
                id: uid("order"),
                number: `T${String(tableId).padStart(2, "0")}-${Date.now().toString().slice(-4)}`,
                type: "Dine In",
                tableId,
                items: [],
                discount: 0,
                status: "Open",
                createdAt: new Date().toISOString(),
              };
              orderId = order.id;
              orders = [order, ...orders];
              tables = tables.map((table) =>
                table.id === tableId ? { ...table, status: "Occupied", orderId: order.id } : table
              );
            }

            const nextOrders = orders.map((item) => {
              if (item.id !== order.id) return item;
              const existing = item.items.find((line) => line.menuId === menuItem.id && !line.note);
              const lines = existing
                ? item.items.map((line) =>
                    line.id === existing.id ? { ...line, qty: line.qty + 1 } : line
                  )
                : [
                    ...item.items,
                    {
                      id: uid("line"),
                      menuId: menuItem.id,
                      name: menuItem.name,
                      category: menuItem.category,
                      price: Number(menuItem.price),
                      image: menuItem.image,
                      qty: 1,
                      note: "",
                    },
                  ];
              return { ...item, items: lines, status: item.status === "Held" ? "Open" : item.status };
            });

            return { ...current, tables, orders: nextOrders };
          });

          setTimeout(() => {
            setActiveOrderId(orderId);
            setSelectedOrderId(orderId);
          }, 0);
        }

        function updateLine(orderId, lineId, patch) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) => {
              if (order.id !== orderId) return order;
              const items = order.items
                .map((line) => (line.id === lineId ? { ...line, ...patch(line) } : line))
                .filter((line) => line.qty > 0);
              return { ...order, items };
            }),
          }));
        }

        function deleteLine(orderId, lineId) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) =>
              order.id === orderId ? { ...order, items: order.items.filter((line) => line.id !== lineId) } : order
            ),
          }));
        }

        function holdOrder(orderId) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) =>
              order.id === orderId ? { ...order, status: "Held", heldAt: new Date().toISOString() } : order
            ),
          }));
        }

        function sendToKitchen(orderId) {
          const order = state.orders.find((item) => item.id === orderId);
          if (!order || order.items.length === 0) return;
          const ticket = {
            id: uid("ticket"),
            orderId: order.id,
            orderNumber: order.number,
            tableId: order.tableId,
            items: order.items.map((item) => ({ ...item })),
            status: "New",
            createdAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            orders: current.orders.map((item) =>
              item.id === orderId ? { ...item, status: "Sent", sentAt: new Date().toISOString() } : item
            ),
            kitchenTickets: [ticket, ...current.kitchenTickets],
          }));
          playOrderBell();
          setView("kds");
        }

        function updateDiscount(orderId, discount) {
          setState((current) => ({
            ...current,
            orders: current.orders.map((order) =>
              order.id === orderId ? { ...order, discount: Math.max(0, Number(discount || 0)) } : order
            ),
          }));
        }

        function completePayment(order, method, splitCount, paymentMeta = {}) {
          const totals = calcOrder(order);
          if (!order || order.items.length === 0 || totals.total <= 0) return;

          const payment = {
            id: uid("pay"),
            orderId: order.id,
            orderNumber: order.number,
            tableId: order.tableId,
            method,
            splitCount,
            tendered: Number(paymentMeta.tendered || totals.total),
            changeDue: Number(paymentMeta.changeDue || 0),
            reference: paymentMeta.reference || "",
            collectedBy: user.name,
            date: todayKey(),
            paidAt: new Date().toISOString(),
            items: order.items.map((item) => ({ ...item })),
            ...totals,
          };

          setState((current) => ({
            ...current,
            payments: [payment, ...current.payments],
            orders: current.orders.map((item) =>
              item.id === order.id ? { ...item, status: "Paid", paidAt: payment.paidAt, paymentId: payment.id } : item
            ),
            tables: current.tables.map((table) =>
              table.id === order.tableId ? { ...table, status: "Cleaning", orderId: null } : table
            ),
          }));
          setReceipt(payment);
          setSelectedOrderId(null);
          if (activeOrderId === order.id) setActiveOrderId(null);
        }

        function updateKitchenStatus(ticketId, status) {
          setState((current) => ({
            ...current,
            kitchenTickets: current.kitchenTickets.map((ticket) =>
              ticket.id === ticketId ? { ...ticket, status, updatedAt: new Date().toISOString() } : ticket
            ),
          }));
        }

        function clockCurrentUser(type) {
          const staff = staffDirectory.find((item) => item.id === user.id);
          if (!staff) return;
          const now = new Date().toISOString();
          setState((current) => {
            const open = current.timecards.find(
              (card) => card.staffId === staff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !open) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: staff.id,
                    staffName: staff.name,
                    role: staff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,
                  },
                  ...current.timecards,
                ],
              };
            }
            if (type === "out" && open) {
              return {
                ...current,
                timecards: current.timecards.map((card) =>
                  card.id === open.id ? { ...card, clockOut: now } : card
                ),
              };
            }
            return current;
          });
        }

        return (
          <div className="flex min-h-screen bg-ink text-white">
            <aside className="flex w-24 shrink-0 flex-col border-r border-line bg-black/30 px-3 py-4 lg:w-28">
              <button
                onClick={() => setView("tables")}
                className="mb-5 flex h-16 items-center justify-center rounded-lg bg-orange text-xl font-black text-black"
              >
                AP
              </button>
              <nav className="flex flex-1 flex-col gap-2">
                {navItems
                  .filter((item) => user.role === "manager" || !item.managerOnly)
                  .map((item) => (
                    <button
                      key={item.id}
                      data-testid={`nav-${item.id}`}
                      onClick={() => setView(item.id)}
                      className={cx(
                        "min-h-16 rounded-lg border px-2 text-sm font-semibold transition active:scale-[.98]",
                        view === item.id
                          ? "border-orange bg-orange text-black"
                          : "border-transparent bg-panel text-zinc-300 hover:border-line"
                      )}
                      title={item.label}
                    >
                      <div className="text-lg font-black">{item.icon}</div>
                      <div>{item.label}</div>
                    </button>
                  ))}
              </nav>
              <button
                onClick={logout}
                className="mt-4 min-h-14 rounded-lg border border-line bg-panel text-sm font-semibold text-zinc-300"
              >
                Logout
              </button>
            </aside>

            <main className="flex min-w-0 flex-1 flex-col">
              <header className="flex min-h-20 items-center justify-between border-b border-line bg-ink/95 px-5">
                <div>
                  <div className="text-sm font-semibold uppercase tracking-[.18em] text-orange2">
                    {view === "kds" ? "Kitchen Display" : "Restaurant POS"}
                  </div>
                  <h2 className="text-2xl font-semibold tracking-normal">
                    {settings.businessName} / {navItems.find((item) => item.id === view)?.label || "Tables"}
                  </h2>
                </div>
                <div className="flex items-center gap-3">
                  <div className="hidden rounded-lg border border-line bg-panel px-4 py-3 text-right md:block">
                    <div className="text-sm text-zinc-400">{displayDateTime()}</div>
                    <div className="font-semibold">
                      {user.name} <span className="text-zinc-500">/</span> {user.role === "staff" ? user.title : "manager"}
                    </div>
                  </div>
                  {user.role === "staff" && (
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => clockCurrentUser("in")}
                        className="min-h-12 rounded-lg border border-emerald-400/30 bg-emerald-500/10 px-4 text-sm font-semibold text-emerald-200"
                      >
                        Clock In
                      </button>
                      <button
                        onClick={() => clockCurrentUser("out")}
                        className="min-h-12 rounded-lg border border-line bg-panel px-4 text-sm font-semibold"
                      >
                        Clock Out
                      </button>
                    </div>
                  )}
                  <div className="rounded-lg border border-line bg-panel px-4 py-3">
                    <div className="text-xs text-zinc-400">On Duty</div>
                    <div className="text-xl font-bold text-emerald-300">{onDuty.length}</div>
                  </div>
                  <div className="rounded-lg border border-line bg-panel px-4 py-3">
                    <div className="text-xs text-zinc-400">Today Sales</div>
                    <div className="text-xl font-bold text-orange2">
                      {money(todayPayments.reduce((sum, payment) => sum + payment.total, 0))}
                    </div>
                  </div>
                  <div className={cx("hidden rounded-lg border px-4 py-3 lg:block", syncTone)}>
                    <div className="text-xs opacity-75">Sync</div>
                    <div className="text-sm font-black">{syncStatus.label}</div>
                  </div>
                  {user.role === "manager" && (
                    <button
                      onClick={resetDemo}
                      className="min-h-14 rounded-lg border border-line bg-panel px-4 text-sm font-bold text-zinc-300"
                    >
                      Reset Demo
                    </button>
                  )}
                </div>
              </header>

              <section className="min-h-0 flex-1 overflow-hidden">
                {view === "tables" && (
                  <TablesView
                    tables={state.tables}
                    orders={state.orders}
                    onOpenTable={createOrderForTable}
                    onStatus={updateTableStatus}
                    onTakeaway={createTakeawayOrder}
                  />
                )}
                {view === "pos" && (
                  <PosView
                    menuItems={state.menuItems}
                    order={activeOrder}
                    selectedTableId={selectedTableId}
                    openOrders={openOrders}
                    onSelectOrder={(orderId) => {
                      setActiveOrderId(orderId);
                      setSelectedOrderId(orderId);
                    }}
                    onAdd={addItem}
                    onQty={(lineId, delta) =>
                      activeOrder && updateLine(activeOrder.id, lineId, (line) => ({ qty: line.qty + delta }))
                    }
                    onNote={(lineId, note) =>
                      activeOrder && updateLine(activeOrder.id, lineId, () => ({ note }))
                    }
                    onDelete={(lineId) => activeOrder && deleteLine(activeOrder.id, lineId)}
                    onDiscount={(discount) => activeOrder && updateDiscount(activeOrder.id, discount)}
                    onHold={() => activeOrder && holdOrder(activeOrder.id)}
                    onSend={() => activeOrder && sendToKitchen(activeOrder.id)}
                    onPay={() => {
                      if (activeOrder) {
                        setSelectedOrderId(activeOrder.id);
                        setView("cashier");
                      }
                    }}
                    onNewTakeaway={createTakeawayOrder}
                    onTables={() => setView("tables")}
                  />
                )}
                {view === "kds" && (
                  <KdsView tickets={state.kitchenTickets} onStatus={updateKitchenStatus} />
                )}
                {view === "cashier" && (
                  <CashierView
                    orders={openOrders}
                    selectedOrder={selectedOrder}
                    onSelect={(orderId) => setSelectedOrderId(orderId)}
                    onPayment={completePayment}
                    onTables={() => setView("tables")}
                  />
                )}
                {view === "reports" && (
                  <ReportsView payments={state.payments} supplierRecords={state.supplierRecords || []} />
                )}
                {view === "supplier" && (
                  <SupplierView state={state} setState={setState} />
                )}
                {view === "staff" && (
                  <StaffView state={state} setState={setState} staffDirectory={staffDirectory} />
                )}
                {view === "menu" && (
                  <MenuManagerView state={state} setState={setState} categories={CATEGORIES} />
                )}
                {view === "settings" && (
                  <SettingsView
                    state={state}
                    setState={setState}
                    cloudConfig={cloudConfig}
                    setCloudConfig={setCloudConfig}
                    syncStatus={syncStatus}
                  />
                )}
              </section>
            </main>

            {receipt && <ReceiptModal receipt={receipt} settings={settings} onClose={() => setReceipt(null)} />}
          </div>
        );
      }

      function TablesView({ tables, orders, onOpenTable, onStatus, onTakeaway }) {
        const [filter, setFilter] = useState("All");
        const visibleTables = filter === "All" ? tables : tables.filter((table) => table.status === filter);
        const statusCounts = TABLE_STATUSES.reduce((acc, status) => {
          acc[status] = tables.filter((table) => table.status === status).length;
          return acc;
        }, {});

        return (
          <div className="h-full overflow-auto p-5">
            <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap gap-2">
                {["All", ...TABLE_STATUSES].map((status) => (
                  <button
                    key={status}
                    onClick={() => setFilter(status)}
                    className={cx(
                      "min-h-12 rounded-lg border px-4 text-sm font-semibold",
                      filter === status ? "border-orange bg-orange text-black" : "border-line bg-panel text-zinc-300"
                    )}
                  >
                    {status}
                    {status !== "All" && <span className="ml-2 text-xs opacity-75">{statusCounts[status]}</span>}
                  </button>
                ))}
              </div>
              <button
                onClick={onTakeaway}
                className="min-h-12 rounded-lg bg-orange px-5 font-bold text-black"
              >
                New Takeaway
              </button>
            </div>

            <div className="grid grid-cols-2 gap-4 md:grid-cols-4 xl:grid-cols-5">
              {visibleTables.map((table) => {
                const order = orders.find((item) => item.id === table.orderId);
                const totals = order ? calcOrder(order) : null;
                return (
                  <div key={table.id} className="rounded-lg border border-line bg-panel p-4">
                    <button
                      data-testid={`table-${table.id}`}
                      onClick={() => onOpenTable(table.id)}
                      className="block min-h-36 w-full rounded-lg border border-white/5 bg-panel2 p-4 text-left active:scale-[.99]"
                    >
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <div className="text-sm text-zinc-400">Table</div>
                          <div className="mt-1 text-4xl font-black">{table.id}</div>
                        </div>
                        <span className={cx("rounded-full border px-3 py-1 text-xs font-bold", statusClass(table.status))}>
                          {table.status}
                        </span>
                      </div>
                      <div className="mt-6 grid grid-cols-2 gap-2 text-sm">
                        <div className="rounded-md bg-black/25 p-2">
                          <div className="text-zinc-500">Order</div>
                          <div className="truncate font-semibold">{order?.number || "None"}</div>
                        </div>
                        <div className="rounded-md bg-black/25 p-2">
                          <div className="text-zinc-500">Total</div>
                          <div className="font-semibold">{totals ? money(totals.total) : "-"}</div>
                        </div>
                      </div>
                    </button>
                    <div className="mt-3 grid grid-cols-2 gap-2">
                      {["Reserved", "Cleaning", "Available", "Occupied"].map((status) => (
                        <button
                          key={status}
                          onClick={() => onStatus(table.id, status)}
                          className="min-h-10 rounded-md border border-line bg-ink text-xs font-semibold text-zinc-300"
                        >
                          {status}
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      }

      function PosView({
        menuItems,
        order,
        openOrders,
        onSelectOrder,
        onAdd,
        onQty,
        onNote,
        onDelete,
        onDiscount,
        onHold,
        onSend,
        onPay,
        onNewTakeaway,
        onTables,
      }) {
        const [category, setCategory] = useState("All");
        const [search, setSearch] = useState("");
        const totals = calcOrder(order);
        const filtered = menuItems.filter((item) => {
          const matchesCategory = category === "All" || item.category === category;
          const query = search.trim().toLowerCase();
          const matchesSearch =
            !query ||
            item.name.toLowerCase().includes(query) ||
            item.category.toLowerCase().includes(query);
          return matchesCategory && matchesSearch;
        });

        return (
          <div className="grid h-full grid-cols-1 overflow-hidden xl:grid-cols-[1fr_430px]">
            <section className="min-h-0 overflow-auto border-r border-line p-5">
              <div className="mb-4 flex flex-wrap items-center gap-3">
                <button
                  onClick={onTables}
                  className="min-h-12 rounded-lg border border-line bg-panel px-4 font-semibold text-zinc-200"
                >
                  Tables
                </button>
                <button
                  onClick={onNewTakeaway}
                  className="min-h-12 rounded-lg border border-line bg-panel px-4 font-semibold text-zinc-200"
                >
                  Takeaway
                </button>
                <select
                  value={order?.id || ""}
                  onChange={(event) => onSelectOrder(event.target.value)}
                  className="min-h-12 min-w-64 rounded-lg border border-line bg-panel px-4 text-zinc-200 outline-none focus:border-orange"
                >
                  <option value="">Select active order</option>
                  {openOrders.map((item) => (
                    <option key={item.id} value={item.id}>
                      {item.number} - {item.type} - {item.status}
                    </option>
                  ))}
                </select>
                <input
                  value={search}
                  onChange={(event) => setSearch(event.target.value)}
                  placeholder="Search food or category"
                  className="min-h-12 flex-1 rounded-lg border border-line bg-panel px-4 text-white outline-none focus:border-orange"
                />
              </div>

              <div className="mb-5 flex gap-2 overflow-auto pb-1 no-scrollbar">
                {["All", ...CATEGORIES].map((item) => (
                  <button
                    key={item}
                    onClick={() => setCategory(item)}
                    className={cx(
                      "min-h-12 shrink-0 rounded-lg border px-4 text-sm font-bold",
                      category === item ? "border-orange bg-orange text-black" : "border-line bg-panel text-zinc-300"
                    )}
                  >
                    {item}
                  </button>
                ))}
              </div>

              <div className="grid grid-cols-2 gap-4 lg:grid-cols-3 2xl:grid-cols-4">
                {filtered.map((item) => (
                  <button
                    key={item.id}
                    data-testid={`menu-${item.id}`}
                    onClick={() => onAdd(item)}
                    disabled={item.soldOut}
                    className={cx(
                      "group overflow-hidden rounded-lg border border-line bg-panel text-left shadow-soft transition active:scale-[.99]",
                      item.soldOut && "opacity-50"
                    )}
                  >
                    <div className="relative aspect-[4/3] overflow-hidden bg-panel2">
                      <img
                        src={item.image}
                        alt={item.name}
                        className="h-full w-full object-cover transition group-hover:scale-105"
                      />
                      {item.popular && (
                        <span className="absolute left-3 top-3 rounded-full bg-orange px-3 py-1 text-xs font-black text-black">
                          Popular
                        </span>
                      )}
                      {item.soldOut && (
                        <span className="absolute inset-0 flex items-center justify-center bg-black/60 text-lg font-black">
                          Sold Out
                        </span>
                      )}
                    </div>
                    <div className="p-4">
                      <div className="min-h-12 text-lg font-bold leading-6">{item.name}</div>
                      <div className="mt-3 flex items-center justify-between">
                        <span className="rounded-full border border-line px-3 py-1 text-xs font-semibold text-zinc-400">
                          {item.category}
                        </span>
                        <span className="text-xl font-black text-orange2">{money(item.price)}</span>
                      </div>
                    </div>
                  </button>
                ))}
              </div>
            </section>

            <OrderPanel
              order={order}

      function ReportsView({ payments, supplierRecords }) {
        const [range, setRange] = useState("today");
        const [selectedDate, setSelectedDate] = useState(todayKey());
        const [selectedMonth, setSelectedMonth] = useState(monthKey());

        const filteredPayments = payments.filter((payment) => {
          if (range === "today") return payment.date === selectedDate;
          if (range === "month") return (payment.date || "").startsWith(selectedMonth);
          return true;
        });
        const filteredSupplierRecords = (supplierRecords || []).filter((record) => {
          if (range === "today") return record.date === selectedDate;
          if (range === "month") return (record.date || "").startsWith(selectedMonth);
          return true;
        });
        const todayPayments = payments.filter((payment) => payment.date === todayKey());
        const monthPayments = payments.filter((payment) => (payment.date || "").startsWith(monthKey()));
        const report = summarizePayments(filteredPayments);
        const todayReport = summarizePayments(todayPayments);
        const monthReport = summarizePayments(monthPayments);
        const supplierReport = summarizeSupplierRecords(filteredSupplierRecords);
        const average = report.orders ? report.total / report.orders : 0;
        const netFoodSales = Math.max(0, report.subtotal - report.discount);
        const directCostCategories = new Set(["Food Ingredients", "Packaging", "Beverage Stock"]);
        const directCosts = filteredSupplierRecords
          .filter((record) => directCostCategories.has(record.category))
          .reduce((sum, record) => sum + Number(record.amount || 0), 0);
        const grossProfit = netFoodSales - directCosts;
        const netProfit = report.total - supplierReport.total;

        const methodStats = PAYMENT_METHODS.reduce((acc, method) => {
          const methodPayments = filteredPayments.filter((payment) => payment.method === method);
          acc[method] = {
            total: methodPayments.reduce((sum, payment) => sum + Number(payment.total || 0), 0),
            count: methodPayments.length,
          };
          return acc;
        }, {});

        const itemStats = {};
        filteredPayments.forEach((payment) => {
          payment.items.forEach((item) => {
            if (!itemStats[item.name]) itemStats[item.name] = { name: item.name, qty: 0, sales: 0 };
            itemStats[item.name].qty += Number(item.qty || 0);
            itemStats[item.name].sales += Number(item.price || 0) * Number(item.qty || 0);
          });
        });
        const hotItems = Object.values(itemStats)
          .sort((a, b) => b.qty - a.qty)
          .slice(0, 6);

        const dailyMap = {};
        filteredPayments.forEach((payment) => {
          const key = payment.date || todayKey(payment.paidAt);
          if (!dailyMap[key]) dailyMap[key] = { date: key, total: 0, cost: 0, orders: 0 };
          dailyMap[key].total += Number(payment.total || 0);
          dailyMap[key].orders += 1;
        });
        filteredSupplierRecords.forEach((record) => {
          const key = record.date || todayKey(record.createdAt);
          if (!dailyMap[key]) dailyMap[key] = { date: key, total: 0, cost: 0, orders: 0 };
          dailyMap[key].cost += Number(record.amount || 0);
        });
        const dailyRows = Object.values(dailyMap)
          .sort((a, b) => a.date.localeCompare(b.date))
          .slice(-14);

        const maxMethod = Math.max(1, ...Object.values(methodStats).map((item) => item.total));
        const maxHot = Math.max(1, ...hotItems.map((item) => item.qty));
        const maxDaily = Math.max(1, ...dailyRows.map((item) => Math.max(item.total, item.cost)));

        return (
          <div className="h-full overflow-auto p-5">
            <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap gap-2">
                {[
                  ["today", "Today"],
                  ["month", "This Month"],
                  ["all", "All Sales"],
                ].map(([key, label]) => (
                  <button
                    key={key}
                    onClick={() => setRange(key)}
                    className={cx(
                      "min-h-12 rounded-lg border px-4 text-sm font-bold",
                      range === key ? "border-orange bg-orange text-black" : "border-line bg-panel text-zinc-300"
                    )}
                  >
                    {label}
                  </button>
                ))}
              </div>
              <div className="flex flex-wrap gap-2">
                {range === "today" && (
                  <input
                    type="date"
                    value={selectedDate}
                    onChange={(event) => setSelectedDate(event.target.value)}
                    className="min-h-12 rounded-lg border border-line bg-panel px-3 text-white outline-none focus:border-orange"
                  />
                )}
                {range === "month" && (
                  <input
                    type="month"
                    value={selectedMonth}
                    onChange={(event) => setSelectedMonth(event.target.value)}
                    className="min-h-12 rounded-lg border border-line bg-panel px-3 text-white outline-none focus:border-orange"
                  />
                )}
                <button
                  onClick={() => window.print()}
                  className="min-h-12 rounded-lg border border-line bg-panel px-4 text-sm font-bold text-zinc-300"
                >
                  Print Report
                </button>
              </div>
            </div>

                ["Sales Collected", money(report.total), `${report.orders} paid orders`],
                ["Supplier Cost", money(supplierReport.total), `${filteredSupplierRecords.length} records`],
                [
                  netProfit >= 0 ? "Profit" : "Loss",
                  money(Math.abs(netProfit)),

                  netProfit >= 0 ? "profit" : "loss",

            <div className="mt-5 grid grid-cols-1 gap-5 xl:grid-cols-[420px_1fr]">

                <h3 className="text-xl font-black">Income Breakdown</h3>
                <div className="mt-5 space-y-3">
                  {[
                    ["Food Sales", report.subtotal],
                    ["Discount", -report.discount],
                    ["Net Food Sales", netFoodSales],
                    ["Service Charge", report.service],
                    ["GST", report.gst],
                    ["Total Collected", report.total],
                    ["Supplier Expenses", -supplierReport.total],
                    ["Paid Supplier Cost", -supplierReport.paid],
                    ["Unpaid Supplier Bills", -supplierReport.unpaid],
                    ["Direct Food Cost", -directCosts],
                    ["Gross Profit", grossProfit],
                    [netProfit >= 0 ? "Net Profit" : "Net Loss", netProfit],
                  ].map(([label, value]) => {
                    const isProfitLine = label.includes("Profit") || label.includes("Loss");
                    const isNegative = Number(value) < 0 || label.includes("Loss");
                    return (
                      <div key={label} className="flex items-center justify-between rounded-lg border border-line bg-ink p-3">
                        <span className="text-sm text-zinc-400">{label}</span>
                        <span

                            "text-lg font-black",
                            isProfitLine && isNegative
                              ? "text-rose-300"
                              : isProfitLine
                              ? "text-emerald-300"
                              : label === "Total Collected"
                              ? "text-orange2"
                              : isNegative
                              ? "text-rose-200"
                              : "text-white"

              <section className="rounded-lg border border-line bg-panel p-5">

                          title={`${day.date} cost ${money(day.cost)}`}

                      <div className="text-center text-[11px] text-zinc-500">{day.date.slice(5)}</div>

              </section>

            <div className="mt-5 grid grid-cols-1 gap-5 xl:grid-cols-2">
              <section className="rounded-lg border border-line bg-panel p-5">

                      <div className="h-4 overflow-hidden rounded-full bg-ink">
                        <div
                          className="h-full rounded-full bg-orange"

                        ></div>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              <section className="rounded-lg border border-line bg-panel p-5">

                    <div key={item.name}>
                      <div className="mb-2 flex justify-between text-sm">

                        <span className="text-zinc-400">{item.qty} sold / {money(item.sales)}</span>

                      <div className="h-4 overflow-hidden rounded-full bg-ink">
                        <div
                          className="h-full rounded-full bg-emerald-400"
                          style={{ width: `${Math.max(8, (item.qty / maxHot) * 100)}%` }}
                        ></div>
                      </div>
                    </div>
                  ))}
                  {hotItems.length === 0 && (
                    <div className="rounded-lg border border-dashed border-line p-8 text-center text-zinc-500">

            <section className="mt-5 rounded-lg border border-line bg-panel p-5">
              <h3 className="text-xl font-black">Receipt Records</h3>
              <div className="mt-4 overflow-auto rounded-lg border border-line">
                <table className="w-full min-w-[900px] text-left text-sm">
                  <thead className="bg-ink text-zinc-400">
                    <tr>
                      <th className="p-3">Date / Time</th>
                      <th className="p-3">Order</th>
                      <th className="p-3">Table</th>
                      <th className="p-3">Method</th>
                      <th className="p-3">Payment Detail</th>
                      <th className="p-3">Staff</th>
                      <th className="p-3 text-right">Total</th>
                    </tr>
                  </thead>

                    {filteredPayments.map((payment) => (
                      <tr key={payment.id} className="border-t border-line">
                        <td className="p-3 text-zinc-400">
                          {displayDate(payment.paidAt)} {displayTime(payment.paidAt)}
                        </td>
                        <td className="p-3 font-semibold">{payment.orderNumber}</td>
                        <td className="p-3">{payment.tableId ? `Table ${payment.tableId}` : "Takeaway"}</td>
                        <td className="p-3">{payment.method}</td>
                        <td className="p-3 text-zinc-400">
                          {payment.method === "Cash"
                            ? `Paid ${money(payment.tendered || payment.total)} / Change ${money(payment.changeDue || 0)}`
                            : payment.reference || "-"}
                        </td>
                        <td className="p-3">{payment.collectedBy || "-"}</td>
                        <td className="p-3 text-right font-black text-orange2">{money(payment.total)}</td>
                      </tr>
                    ))}
                    {filteredPayments.length === 0 && (
                      <tr>
                        <td colSpan="7" className="p-8 text-center text-zinc-500">

                      </tr>

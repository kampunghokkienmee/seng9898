                </table>
              </div>
            </section>
          </div>
        );
      }

      function SupplierView({ state, setState }) {
        const suppliers = state.suppliers?.length ? state.suppliers : defaultSuppliers;
        const records = state.supplierRecords || [];
        const emptySupplierForm = { id: "", name: "", contact: "", category: SUPPLIER_CATEGORIES[0] };
        const emptyRecordForm = {
          id: "",
          supplierId: suppliers[0]?.id || "",
          category: SUPPLIER_CATEGORIES[0],
          date: todayKey(),
          amount: "",
          invoice: "",
          method: "Cash",
          status: "Paid",
          note: "",
        };
        const [supplierForm, setSupplierForm] = useState(emptySupplierForm);
        const [recordForm, setRecordForm] = useState(emptyRecordForm);
        const [range, setRange] = useState("month");
        const [selectedDate, setSelectedDate] = useState(todayKey());
        const [selectedMonth, setSelectedMonth] = useState(monthKey());
        const editingSupplier = Boolean(supplierForm.id);
        const editingRecord = Boolean(recordForm.id);

        useEffect(() => {
          if (!suppliers.find((supplier) => supplier.id === recordForm.supplierId)) {
            setRecordForm((current) => ({
              ...current,
              supplierId: suppliers[0]?.id || "",
              category: suppliers[0]?.category || SUPPLIER_CATEGORIES[0],
            }));
          }
        }, [suppliers, recordForm.supplierId]);

        const filteredRecords = records.filter((record) => {
          if (range === "today") return record.date === selectedDate;
          if (range === "month") return (record.date || "").startsWith(selectedMonth);
          return true;
        });
        const supplierSummary = summarizeSupplierRecords(filteredRecords);
        const categoryRows = Object.entries(supplierSummary.byCategory)
          .map(([category, total]) => ({ category, total }))
          .sort((a, b) => b.total - a.total);
        const maxCategory = Math.max(1, ...categoryRows.map((row) => row.total));
        const recentRecords = [...filteredRecords].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));

        function supplierName(id) {
          return suppliers.find((supplier) => supplier.id === id)?.name || "Unknown Supplier";
        }

        function saveSupplier() {
          if (!supplierForm.name.trim()) return;
          const supplier = {
            id: supplierForm.id || uid("supplier"),
            name: supplierForm.name.trim(),
            contact: supplierForm.contact.trim(),
            category: supplierForm.category || SUPPLIER_CATEGORIES[0],
          };
          setState((current) => ({
            ...current,
            suppliers: editingSupplier
              ? (current.suppliers || suppliers).map((item) => (item.id === supplier.id ? supplier : item))
              : [supplier, ...(current.suppliers || suppliers)],
            supplierRecords: (current.supplierRecords || []).map((record) =>
              record.supplierId === supplier.id ? { ...record, supplierName: supplier.name } : record
            ),
          }));
          setSupplierForm(emptySupplierForm);
          if (!recordForm.supplierId) {
            setRecordForm((current) => ({ ...current, supplierId: supplier.id, category: supplier.category }));
          }
        }

        function deleteSupplier(id) {
          const nextSuppliers = suppliers.filter((supplier) => supplier.id !== id);
          if (nextSuppliers.length === 0) return;
          setState((current) => ({
            ...current,
            suppliers: (current.suppliers || suppliers).filter((supplier) => supplier.id !== id),
          }));
          if (supplierForm.id === id) setSupplierForm(emptySupplierForm);
          if (recordForm.supplierId === id) {
            setRecordForm((current) => ({
              ...current,
              supplierId: nextSuppliers[0].id,
              category: nextSuppliers[0].category,
            }));
          }
        }

        function saveRecord() {
          const supplier = suppliers.find((item) => item.id === recordForm.supplierId) || suppliers[0];
          if (!supplier || !Number(recordForm.amount)) return;
          const record = {
            id: recordForm.id || uid("cost"),
            supplierId: supplier.id,
            supplierName: supplier.name,
            category: recordForm.category || supplier.category || SUPPLIER_CATEGORIES[0],
            date: recordForm.date || todayKey(),
            amount: roundCurrency(recordForm.amount),
            invoice: recordForm.invoice.trim(),
            method: recordForm.method,
            status: recordForm.status,
            note: recordForm.note.trim(),
            createdAt: recordForm.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            supplierRecords: editingRecord
              ? (current.supplierRecords || []).map((item) => (item.id === record.id ? record : item))
              : [record, ...(current.supplierRecords || [])],
          }));
          setRecordForm({
            ...emptyRecordForm,
            supplierId: supplier.id,
            category: record.category,
            date: record.date,
          });
        }

        function deleteRecord(id) {
          setState((current) => ({
            ...current,
            supplierRecords: (current.supplierRecords || []).filter((record) => record.id !== id),
          }));
          if (recordForm.id === id) setRecordForm(emptyRecordForm);
        }

        function markPaid(id) {
          setState((current) => ({
            ...current,
            supplierRecords: (current.supplierRecords || []).map((record) =>
              record.id === id ? { ...record, status: "Paid", updatedAt: new Date().toISOString() } : record
            ),
          }));
        }

        return (
          <div className="grid h-full grid-cols-1 gap-5 overflow-auto p-5 xl:grid-cols-[420px_1fr]">
            <section className="space-y-5">
              <div className="rounded-lg border border-line bg-panel p-5">
                <h3 className="text-xl font-black">{editingRecord ? "Edit Supplier Bill" : "Add Supplier Cost"}</h3>
                <div className="mt-5 space-y-4">
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Supplier</label>
                    <select
                      value={recordForm.supplierId}
                      onChange={(event) => {
                        const supplier = suppliers.find((item) => item.id === event.target.value);
                        setRecordForm({
                          ...recordForm,
                          supplierId: event.target.value,
                          category: supplier?.category || recordForm.category,
                        });
                      }}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    >
                      {suppliers.map((supplier) => (
                        <option key={supplier.id} value={supplier.id}>
                          {supplier.name}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-sm font-semibold text-zinc-400">Date</label>
                      <input
                        type="date"
                        value={recordForm.date}
                        onChange={(event) => setRecordForm({ ...recordForm, date: event.target.value })}
                        className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                      />
                    </div>
                    <div>
                      <label className="text-sm font-semibold text-zinc-400">Amount</label>
                      <input
                        value={recordForm.amount}
                        onChange={(event) => setRecordForm({ ...recordForm, amount: event.target.value })}
                        inputMode="decimal"
                        placeholder="0.00"
                        className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-sm font-semibold text-zinc-400">Category</label>
                      <select
                        value={recordForm.category}
                        onChange={(event) => setRecordForm({ ...recordForm, category: event.target.value })}
                        className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                      >
                        {SUPPLIER_CATEGORIES.map((category) => (
                          <option key={category} value={category}>
                            {category}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-sm font-semibold text-zinc-400">Status</label>
                      <select
                        value={recordForm.status}
                        onChange={(event) => setRecordForm({ ...recordForm, status: event.target.value })}
                        className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                      >
                        {SUPPLIER_STATUSES.map((status) => (
                          <option key={status} value={status}>
                            {status}
                          </option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-sm font-semibold text-zinc-400">Payment</label>
                      <select
                        value={recordForm.method}
                        onChange={(event) => setRecordForm({ ...recordForm, method: event.target.value })}
                        className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                      >
                        {SUPPLIER_PAYMENT_METHODS.map((method) => (
                          <option key={method} value={method}>
                            {method}
                          </option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="text-sm font-semibold text-zinc-400">Invoice</label>
                      <input
                        value={recordForm.invoice}
                        onChange={(event) => setRecordForm({ ...recordForm, invoice: event.target.value })}
                        placeholder="Invoice no."
                        className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Note</label>
                    <input
                      value={recordForm.note}
                      onChange={(event) => setRecordForm({ ...recordForm, note: event.target.value })}
                      placeholder="Noodles, prawns, rent, utilities..."
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={saveRecord} className="min-h-14 rounded-lg bg-orange font-black text-black">
                      {editingRecord ? "Save Cost" : "Add Cost"}
                    </button>
                    <button
                      onClick={() => setRecordForm(emptyRecordForm)}
                      className="min-h-14 rounded-lg border border-line bg-ink font-black"
                    >
                      Clear
                    </button>
                  </div>
                </div>
              </div>

              <div className="rounded-lg border border-line bg-panel p-5">
                <h3 className="text-xl font-black">{editingSupplier ? "Edit Supplier" : "Supplier Directory"}</h3>
                <div className="mt-4 space-y-3">
                  <input
                    value={supplierForm.name}
                    onChange={(event) => setSupplierForm({ ...supplierForm, name: event.target.value })}
                    placeholder="Supplier name"
                    className="min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                  />
                  <input

                    className="min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"

                  <select
                    value={supplierForm.category}
                    onChange={(event) => setSupplierForm({ ...supplierForm, category: event.target.value })}
                    className="min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                  >
                    {SUPPLIER_CATEGORIES.map((category) => (

                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={saveSupplier} className="min-h-12 rounded-lg bg-orange font-black text-black">

                <div className="mt-5 space-y-3">

                        <button

                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            <section className="space-y-5">
              <div className="rounded-lg border border-line bg-panel p-5">
                <div className="flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <h3 className="text-xl font-black">Supplier Cost Report</h3>
                    <div className="mt-1 text-sm text-zinc-400">Costs are deducted in Sales profit report.</div>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {[
                      ["today", "Today"],
                      ["month", "This Month"],
                      ["all", "All"],
                    ].map(([key, label]) => (
                      <button
                        key={key}
                        onClick={() => setRange(key)}
                        className={cx(
                          "min-h-10 rounded-lg border px-3 text-xs font-black",
                          range === key ? "border-orange bg-orange text-black" : "border-line bg-ink text-zinc-300"

                    />

                  {range === "month" && (
                    <input
                      type="month"
                      value={selectedMonth}
                      onChange={(event) => setSelectedMonth(event.target.value)}
                      className="min-h-11 rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />

                  <div className="rounded-lg border border-line bg-ink p-4">
                    <div className="text-sm text-zinc-400">Total Cost</div>
                    <div className="mt-2 text-3xl font-black text-rose-300">{money(supplierSummary.total)}</div>
                  </div>
                  <div className="rounded-lg border border-line bg-ink p-4">
                    <div className="text-sm text-zinc-400">Paid</div>
                    <div className="mt-2 text-3xl font-black text-emerald-300">{money(supplierSummary.paid)}</div>
                  </div>
                  <div className="rounded-lg border border-line bg-ink p-4">
                    <div className="text-sm text-zinc-400">Unpaid</div>
                    <div className="mt-2 text-3xl font-black text-orange2">{money(supplierSummary.unpaid)}</div>
                  </div>
                </div>

                    {categoryRows.map((row) => (
                      <div key={row.category}>
                        <div className="mb-2 flex justify-between text-sm">
                          <span className="font-semibold">{row.category}</span>
                          <span className="text-zinc-400">{money(row.total)}</span>
                        </div>

        const todayCards = state.timecards.filter((card) => card.date === todayKey());
        const onDuty = todayCards.filter((card) => !card.clockOut);
        const monthCards = state.timecards.filter((card) => (card.date || "").startsWith(monthKey()));
        const todayHours = todayCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const monthHours = monthCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const staffHourRows = staffDirectory.map((staff) => {
          const staffToday = todayCards.filter((card) => card.staffId === staff.id);
          const staffMonth = monthCards.filter((card) => card.staffId === staff.id);
          return {
            ...staff,
            todayHours: staffToday.reduce((sum, card) => sum + shiftHours(card), 0),
            monthHours: staffMonth.reduce((sum, card) => sum + shiftHours(card), 0),
            onDuty: staffToday.some((card) => !card.clockOut),
          };
        });

        useEffect(() => {
          if (!staffDirectory.find((staff) => staff.id === selectedStaffId)) {
            setSelectedStaffId(staffDirectory[0]?.id || "");
          }
        }, [staffDirectory, selectedStaffId]);

        function saveStaff() {
          if (!staffForm.name.trim() || !staffForm.pin.trim()) return;
          const nextStaff = {
            id: staffForm.id || uid("staff"),
            name: staffForm.name.trim(),
            role: staffForm.role.trim() || "Server",
            pin: staffForm.pin.trim(),
          };
          setState((current) => saveStaffToState(current, nextStaff, editingStaff));
          setSelectedStaffId(nextStaff.id);
          setStaffForm(emptyStaffForm);
        }

        function deleteStaff(id) {
          setState((current) => deleteStaffFromState(current, id));
          if (selectedStaffId === id) setSelectedStaffId(staffDirectory.find((staff) => staff.id !== id)?.id || "");
          if (staffForm.id === id) setStaffForm(emptyStaffForm);
        }

        function clock(type) {
          const now = new Date().toISOString();
          setState((current) => {
            const open = current.timecards.find(
              (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !open) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: selectedStaff.id,
                    staffName: selectedStaff.name,
                    role: selectedStaff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,
                  },
                  ...current.timecards,
                ],
              };
            }
            if (type === "out" && open) {
              return {
                ...current,
                timecards: current.timecards.map((card) =>
                  card.id === open.id ? { ...card, clockOut: now } : card
                ),
              };

            return current;

            price: Number(form.price),

      function SettingsView({ state, setState, cloudConfig, setCloudConfig, syncStatus }) {
        const settings = { ...defaultSettings, ...(state.settings || {}) };
        const staffDirectory = state.staff?.length ? state.staff : defaultStaffDirectory;
        const emptyStaffForm = { id: "", name: "", role: "Server", pin: "" };
        const [settingsForm, setSettingsForm] = useState(settings);
        const [staffForm, setStaffForm] = useState(emptyStaffForm);
        const [cloudForm, setCloudForm] = useState({ ...defaultCloudConfig, ...(cloudConfig || {}) });
        const editingStaff = Boolean(staffForm.id);
        const syncTone =
          syncStatus.kind === "online"
            ? "border-emerald-400/30 bg-emerald-500/10 text-emerald-200"
            : syncStatus.kind === "error"
            ? "border-rose-400/30 bg-rose-500/10 text-rose-200"
            : syncStatus.kind === "syncing" || syncStatus.kind === "connecting"
            ? "border-sky-400/30 bg-sky-500/10 text-sky-200"
            : "border-line bg-ink text-zinc-300";

        useEffect(() => {
          setCloudForm({ ...defaultCloudConfig, ...(cloudConfig || {}) });
        }, [cloudConfig]);

        function saveSettings() {
          setState((current) => ({
            ...current,
            settings: {
              businessName: settingsForm.businessName.trim() || defaultSettings.businessName,
              tagline: settingsForm.tagline.trim() || defaultSettings.tagline,
              managerName: settingsForm.managerName.trim() || defaultSettings.managerName,
              managerPin: settingsForm.managerPin.trim() || defaultSettings.managerPin,
            },
          }));
        }

        function saveStaff() {
          if (!staffForm.name.trim() || !staffForm.pin.trim()) return;
          const nextStaff = {
            id: staffForm.id || uid("staff"),
            name: staffForm.name.trim(),
            role: staffForm.role.trim() || "Server",
            pin: staffForm.pin.trim(),
          };
          setState((current) => saveStaffToState(current, nextStaff, editingStaff));
          setStaffForm(emptyStaffForm);
        }

        function deleteStaff(id) {
          setState((current) => deleteStaffFromState(current, id));
          if (staffForm.id === id) setStaffForm(emptyStaffForm);
        }

        function saveCloudSettings() {
          setCloudConfig({
            enabled: Boolean(cloudForm.enabled),
            restaurantId: cloudForm.restaurantId.trim() || defaultCloudConfig.restaurantId,
            apiKey: cloudForm.apiKey.trim(),
            authDomain: cloudForm.authDomain.trim(),
            databaseURL: cloudForm.databaseURL.trim(),
            projectId: cloudForm.projectId.trim(),
            appId: cloudForm.appId.trim(),
          });
        }

        function disableCloudSync() {

                <div className="my-4 border-t border-line"></div>

                <div className="space-y-2 text-sm">

      function App() {
        const [state, setState] = useState(loadState);
        const [cloudConfig, setCloudConfig] = useState(loadCloudConfig);
        const [syncStatus, setSyncStatus] = useState({
          kind: "local",
          label: "Local",
          message: "This device only",
        });
        const deviceIdRef = useRef(getDeviceId());
        const stateRef = useRef(state);
        const remoteRef = useRef(null);
        const remoteReadyRef = useRef(false);
        const applyingRemoteRef = useRef(false);
        const lastRemoteRevisionRef = useRef(0);
        const [user, setUser] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem(SESSION_KEY));
          } catch (error) {
            return null;
          }
        });

        useEffect(() => {
          stateRef.current = state;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          document.title = `${state.settings?.businessName || defaultSettings.businessName} | ${state.settings?.tagline || defaultSettings.tagline}`;

          if (!remoteRef.current || !remoteReadyRef.current || !hasCloudConfig(cloudConfig)) return;
          if (applyingRemoteRef.current) {
            applyingRemoteRef.current = false;
            return;
          }

          const revision = Date.now();
          lastRemoteRevisionRef.current = revision;
          setSyncStatus({ kind: "syncing", label: "Syncing", message: "Saving to cloud" });
          remoteRef.current
            .set({
              state,
              revision,
              deviceId: deviceIdRef.current,
              updatedAt: new Date().toISOString(),
            })
            .then(() => {
              setSyncStatus({ kind: "online", label: "Cloud", message: `Synced ${displayTime()}` });
            })
            .catch((error) => {
              setSyncStatus({ kind: "error", label: "Error", message: error.message || "Cloud save failed" });
            });
        }, [state]);

        useEffect(() => {
          localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
        }, [cloudConfig]);

        useEffect(() => {
          remoteRef.current = null;
          remoteReadyRef.current = false;
          applyingRemoteRef.current = false;
          lastRemoteRevisionRef.current = 0;

          if (!cloudConfig.enabled) {
            setSyncStatus({ kind: "local", label: "Local", message: "This device only" });
            return;
          }

          if (!hasCloudConfig(cloudConfig)) {
            setSyncStatus({ kind: "setup", label: "Setup", message: "Cloud fields needed" });
            return;
          }

          if (!window.firebase?.database) {
            setSyncStatus({ kind: "error", label: "Error", message: "Firebase is not loaded" });
            return;
          }

          let cancelled = false;
          let ref = null;

          async function connectCloud() {
            try {
              setSyncStatus({ kind: "connecting", label: "Cloud", message: "Connecting" });
              const appName = `pos-${sanitizeCloudPath(cloudConfig.restaurantId)}`;
              const app =
                firebase.apps.find((item) => item.name === appName) ||
                firebase.initializeApp(firebaseOptions(cloudConfig), appName);
              ref = firebase.database(app).ref(cloudStatePath(cloudConfig));
              remoteRef.current = ref;

              const snapshot = await ref.once("value");
              if (cancelled) return;
              const payload = snapshot.val();

              if (payload?.state) {
                lastRemoteRevisionRef.current = Number(payload.revision || 0);
                applyingRemoteRef.current = true;
                setState(hydrateState(payload.state));
                setSyncStatus({
                  kind: "online",
                  label: "Cloud",
                  message: `Loaded ${displayTime(payload.updatedAt || new Date())}`,
                });
              } else {
                const revision = Date.now();
                lastRemoteRevisionRef.current = revision;
                await ref.set({
                  state: stateRef.current,
                  revision,
                  deviceId: deviceIdRef.current,
                  updatedAt: new Date().toISOString(),
                });
                setSyncStatus({ kind: "online", label: "Cloud", message: "Cloud ready" });
              }

              remoteReadyRef.current = true;
              ref.on(
                "value",
                (nextSnapshot) => {
                  if (cancelled) return;
                  const nextPayload = nextSnapshot.val();
                  if (!nextPayload?.state) return;
                  const revision = Number(nextPayload.revision || 0);
                  if (nextPayload.deviceId === deviceIdRef.current || revision <= lastRemoteRevisionRef.current) return;
                  lastRemoteRevisionRef.current = revision;
                  applyingRemoteRef.current = true;
                  setState(hydrateState(nextPayload.state));
                  setSyncStatus({
                    kind: "online",
                    label: "Cloud",
                    message: `Updated ${displayTime(nextPayload.updatedAt || new Date())}`,
                  });
                },
                (error) => {
                  setSyncStatus({ kind: "error", label: "Error", message: error.message || "Cloud read failed" });
                }
              );
            } catch (error) {
              setSyncStatus({ kind: "error", label: "Error", message: error.message || "Cloud connection failed" });
            }
          }

          connectCloud();

          return () => {
            cancelled = true;
            if (ref) ref.off();
          };
        }, [
          cloudConfig.enabled,
          cloudConfig.apiKey,
          cloudConfig.authDomain,
          cloudConfig.databaseURL,
          cloudConfig.projectId,
          cloudConfig.appId,
          cloudConfig.restaurantId,
        ]);

        if (!user) {
          return <LoginScreen state={state} setState={setState} onLogin={setUser} />;
        }

        return (
          <AppShell
            user={user}
            setUser={setUser}
            state={state}
            setState={setState}
            cloudConfig={cloudConfig}
            setCloudConfig={setCloudConfig}
            syncStatus={syncStatus}
          />
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

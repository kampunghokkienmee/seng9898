      (function () {
        var pendingMessage = "";

        function escapeBootMessage(value) {
          var entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
          return String(value || "").replace(/[&<>\"]/g, function (character) {
            return entities[character];
          });
        }

        function repairThisDevice() {
          try {
            window.localStorage.removeItem("aurora-ipad-pos-session-v1");
            window.localStorage.removeItem("aurora-ipad-pos-kds-hidden-v1");
            window.localStorage.removeItem("aurora-ipad-pos-kds-progress-v1");
          } catch (error) {
            // Reload still helps when Safari blocks storage access completely.
          }
          window.location.reload();
        }

        function showBootError(message) {
          pendingMessage = String(message || "The POS could not start on this device.");
          var root = document.getElementById("root");
          if (!root || root.getAttribute("data-pos-ready") === "true") return;
          root.innerHTML =
            '<main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f5;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;box-sizing:border-box">' +

                '<div style="font-size:28px;font-weight:800">Pho Stop POS</div>' +
                '<p style="margin:12px 0 18px;color:#52525b;line-height:1.55">' + escapeBootMessage(pendingMessage) + '</p>' +

              '</section>' +
            '</main>';
        }

        window.__repairPosDevice = repairThisDevice;
        window.__showPosBootError = showBootError;
        window.addEventListener("error", function (event) {
          showBootError((event && event.message) || "A required POS file failed to load. Check the internet connection and reload.");
        });
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          showBootError((reason && reason.message) || "The POS could not finish loading. Please reload.");
        });
        window.addEventListener("DOMContentLoaded", function () {
          if (pendingMessage) showBootError(pendingMessage);
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && root.getAttribute("data-pos-ready") !== "true") {
              showBootError("The POS is taking too long to load. Check the internet connection, then reload.");
            }
          }, 25000);
        });
      })();

      function safeStorageGet(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (error) {
          console.warn("POS storage read failed", error);
          return null;
        }
      }

      function safeStorageSet(key, value) {
        try {
          window.localStorage.setItem(key, value);
          return true;
        } catch (error) {
          console.warn("POS storage write failed", error);
          return false;
        }
      }

      function safeStorageRemove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (error) {
          console.warn("POS storage remove failed", error);
        }
      }

      function confirmDeviceRepair() {
        const enteredPin = window.prompt("Enter Device Repair PIN");
        if (enteredPin === null) return false;
        if (enteredPin !== RESET_DEMO_PIN) {
          window.alert("Incorrect PIN. This device was not changed.");
          return false;
        }
        return window.confirm(
          "Repair this device session? Sales, clock records, suppliers, leave and cloud data will be kept."
        );
      }

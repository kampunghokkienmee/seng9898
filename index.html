                      <div key={row.category}>
                        <div className="mb-2 flex justify-between text-sm">
                          <span className="font-semibold">{row.category}</span>
                          <span className="text-zinc-400">{money(row.total)}</span>
                        </div>
                        <div className="h-4 overflow-hidden rounded-full bg-ink">
                          <div
                            className="h-full rounded-full bg-rose-400"
                            style={{ width: `${Math.max(8, (row.total / maxCategory) * 100)}%` }}
                          ></div>
                        </div>
                      </div>
                    ))}
                    {categoryRows.length === 0 && (
                      <div className="rounded-lg border border-dashed border-line p-8 text-center text-zinc-500">
                        No supplier cost yet.
                      </div>
                    )}
                  </div>
                </div>

                <div className="rounded-lg border border-line bg-panel p-5">
                  <h3 className="text-xl font-black">Suppliers</h3>
                  <div className="mt-5 space-y-3">
                    {suppliers.map((supplier) => {
                      const total = records
                        .filter((record) => record.supplierId === supplier.id)
                        .reduce((sum, record) => sum + Number(record.amount || 0), 0);
                      return (
                        <div key={supplier.id} className="flex items-center justify-between rounded-lg border border-line bg-ink p-3">
                          <div>
                            <div className="font-black">{supplier.name}</div>
                            <div className="mt-1 text-sm text-zinc-500">{supplier.category}</div>
                          </div>
                          <div className="text-right font-black text-orange2">{money(total)}</div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="rounded-lg border border-line bg-panel p-5">
                <h3 className="text-xl font-black">Supplier Records</h3>
                <div className="mt-4 overflow-auto rounded-lg border border-line">
                  <table className="w-full min-w-[980px] text-left text-sm">
                    <thead className="bg-ink text-zinc-400">
                      <tr>
                        <th className="p-3">Date</th>
                        <th className="p-3">Supplier</th>
                        <th className="p-3">Category</th>
                        <th className="p-3">Invoice</th>
                        <th className="p-3">Payment</th>
                        <th className="p-3">Status</th>
                        <th className="p-3 text-right">Amount</th>
                        <th className="p-3 text-right">Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {recentRecords.map((record) => (
                        <tr key={record.id} className="border-t border-line">
                          <td className="p-3 text-zinc-400">{displayDate(record.date)}</td>
                          <td className="p-3 font-semibold">{record.supplierName || supplierName(record.supplierId)}</td>
                          <td className="p-3">{record.category}</td>
                          <td className="p-3 text-zinc-400">{record.invoice || "-"}</td>
                          <td className="p-3">{record.method}</td>
                          <td className="p-3">
                            <span
                              className={cx(
                                "rounded-full border px-2 py-1 text-xs font-bold",
                                record.status === "Paid" ? statusClass("Available") : statusClass("Held")
                              )}
                            >
                              {record.status}
                            </span>
                          </td>
                          <td className="p-3 text-right font-black text-rose-300">{money(record.amount)}</td>
                          <td className="p-3">
                            <div className="flex justify-end gap-2">
                              <button
                                onClick={() => setRecordForm({ ...record, amount: String(record.amount) })}
                                className="min-h-9 rounded-md border border-line bg-ink px-3 text-xs font-bold"
                              >
                                Edit
                              </button>
                              {record.status === "Unpaid" && (
                                <button
                                  onClick={() => markPaid(record.id)}
                                  className="min-h-9 rounded-md border border-emerald-400/30 bg-emerald-500/10 px-3 text-xs font-bold text-emerald-200"
                                >
                                  Paid
                                </button>
                              )}
                              <button
                                onClick={() => deleteRecord(record.id)}
                                className="min-h-9 rounded-md border border-rose-400/30 bg-rose-500/10 px-3 text-xs font-bold text-rose-200"
                              >
                                Delete
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                      {recentRecords.length === 0 && (
                        <tr>
                          <td colSpan="8" className="p-8 text-center text-zinc-500">
                            No supplier records for this period.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          </div>
        );
      }

      function StaffView({ state, setState, staffDirectory }) {
        const [selectedStaffId, setSelectedStaffId] = useState(staffDirectory[0].id);
        const [attendanceRange, setAttendanceRange] = useState("today");
        const [attendanceDate, setAttendanceDate] = useState(todayKey());
        const emptyStaffForm = { id: "", name: "", role: "Server", pin: "" };
        const emptyLeaveForm = {
          id: "",
          staffId: staffDirectory[0]?.id || "",
          type: LEAVE_TYPES[0],
          startDate: todayKey(),
          endDate: todayKey(),
          status: "Pending",
          reason: "",
        };
        const [staffForm, setStaffForm] = useState(emptyStaffForm);
        const [leaveForm, setLeaveForm] = useState(emptyLeaveForm);
        const [leaveRange, setLeaveRange] = useState("month");
        const [leaveDate, setLeaveDate] = useState(todayKey());
        const editingStaff = Boolean(staffForm.id);
        const editingLeave = Boolean(leaveForm.id);
        const selectedStaff = staffDirectory.find((staff) => staff.id === selectedStaffId) || staffDirectory[0];
        const leaveRequests = state.leaveRequests || [];
        const todayCards = state.timecards.filter((card) => card.date === todayKey());
        const onDuty = todayCards.filter((card) => !card.clockOut);
        const monthCards = state.timecards.filter((card) => (card.date || "").startsWith(monthKey()));
        const todayHours = todayCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const monthHours = monthCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const leaveMonth = leaveDate.slice(0, 7);
        const leaveReportRows = leaveRequests
          .filter((request) => {
            const start = request.startDate || todayKey();
            const end = request.endDate || start;
            if (leaveRange === "today") return start <= leaveDate && end >= leaveDate;
            if (leaveRange === "month") return start <= `${leaveMonth}-31` && end >= `${leaveMonth}-01`;
            return true;
          })
          .sort((a, b) => new Date(b.startDate || b.createdAt).getTime() - new Date(a.startDate || a.createdAt).getTime());
        const leaveTotalDays = leaveReportRows.reduce((sum, request) => sum + leaveDays(request.startDate, request.endDate), 0);
        const leaveApprovedDays = leaveReportRows
          .filter((request) => request.status === "Approved")
          .reduce((sum, request) => sum + leaveDays(request.startDate, request.endDate), 0);
        const leavePendingCount = leaveReportRows.filter((request) => request.status === "Pending").length;
        const leaveSummaryRows = staffDirectory.map((staff) => {
          const staffLeaves = leaveReportRows.filter((request) => request.staffId === staff.id);
          return {
            ...staff,
            requests: staffLeaves.length,
            approvedDays: staffLeaves
              .filter((request) => request.status === "Approved")
              .reduce((sum, request) => sum + leaveDays(request.startDate, request.endDate), 0),
            pending: staffLeaves.filter((request) => request.status === "Pending").length,
          };
        });
        const attendanceMonth = attendanceDate.slice(0, 7);
        const attendanceCards = state.timecards
          .filter((card) => {
            if (attendanceRange === "today") return card.date === attendanceDate;
            if (attendanceRange === "month") return (card.date || "").startsWith(attendanceMonth);
            return true;
          })
          .sort((a, b) => new Date(b.clockIn || b.date).getTime() - new Date(a.clockIn || a.date).getTime());
        const attendanceTotalHours = attendanceCards.reduce((sum, card) => sum + shiftHours(card), 0);
        const attendanceOpenShifts = attendanceCards.filter((card) => !card.clockOut).length;
        const attendanceStaffRows = staffDirectory.map((staff) => {
          const staffCards = attendanceCards.filter((card) => card.staffId === staff.id);
          return {
            ...staff,
            shifts: staffCards.length,
            hours: staffCards.reduce((sum, card) => sum + shiftHours(card), 0),
            onDuty: staffCards.some((card) => !card.clockOut),
          };
        });
        const staffHourRows = staffDirectory.map((staff) => {
          const staffToday = todayCards.filter((card) => card.staffId === staff.id);
          const staffMonth = monthCards.filter((card) => card.staffId === staff.id);
          return {
            ...staff,
            todayHours: staffToday.reduce((sum, card) => sum + shiftHours(card), 0),
            monthHours: staffMonth.reduce((sum, card) => sum + shiftHours(card), 0),
            onDuty: staffToday.some((card) => !card.clockOut),
          };
        });

        useEffect(() => {
          if (!staffDirectory.find((staff) => staff.id === selectedStaffId)) {
            setSelectedStaffId(staffDirectory[0]?.id || "");
          }
          if (!staffDirectory.find((staff) => staff.id === leaveForm.staffId)) {
            setLeaveForm((current) => ({ ...current, staffId: staffDirectory[0]?.id || "" }));
          }
        }, [staffDirectory, selectedStaffId]);

        function saveStaff() {
          if (!staffForm.name.trim() || !staffForm.pin.trim()) return;
          const nextStaff = {
            id: staffForm.id || uid("staff"),
            name: staffForm.name.trim(),
            role: staffForm.role.trim() || "Server",
            pin: staffForm.pin.trim(),
          };
          setState((current) => saveStaffToState(current, nextStaff, editingStaff));
          setSelectedStaffId(nextStaff.id);
          setStaffForm(emptyStaffForm);
        }

        function deleteStaff(id) {
          setState((current) => deleteStaffFromState(current, id));
          if (selectedStaffId === id) setSelectedStaffId(staffDirectory.find((staff) => staff.id !== id)?.id || "");
          if (staffForm.id === id) setStaffForm(emptyStaffForm);
        }

        function clock(type) {
          const now = new Date().toISOString();
          setState((current) => {
            const open = current.timecards.find(
              (card) => card.staffId === selectedStaff.id && card.date === todayKey() && !card.clockOut
            );
            if (type === "in" && !open) {
              return {
                ...current,
                timecards: [
                  {
                    id: uid("clock"),
                    staffId: selectedStaff.id,
                    staffName: selectedStaff.name,
                    role: selectedStaff.role,
                    date: todayKey(),
                    clockIn: now,
                    clockOut: null,
                  },
                  ...current.timecards,
                ],
              };
            }
            if (type === "out" && open) {
              return {
                ...current,
                timecards: current.timecards.map((card) =>
                  card.id === open.id ? { ...card, clockOut: now } : card
                ),
              };
            }
            return current;
          });
        }

        function printAttendanceReport() {
          document.body.classList.add("attendance-printing");
          setTimeout(() => {
            window.print();
            setTimeout(() => document.body.classList.remove("attendance-printing"), 400);
          }, 50);
        }

        function saveLeaveRequest() {
          const staff = staffDirectory.find((item) => item.id === leaveForm.staffId) || staffDirectory[0];
          if (!staff || !leaveForm.startDate) return;
          const startDate = leaveForm.startDate;
          const endDate = leaveForm.endDate && leaveForm.endDate >= startDate ? leaveForm.endDate : startDate;
          const request = {
            id: leaveForm.id || uid("leave"),
            staffId: staff.id,
            staffName: staff.name,
            role: staff.role,
            type: leaveForm.type,
            startDate,
            endDate,
            days: leaveDays(startDate, endDate),
            status: leaveForm.status,
            reason: leaveForm.reason.trim(),
            createdAt: leaveForm.createdAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),
          };
          setState((current) => ({
            ...current,
            leaveRequests: editingLeave
              ? (current.leaveRequests || []).map((item) => (item.id === request.id ? request : item))
              : [request, ...(current.leaveRequests || [])],
          }));
          setLeaveForm({ ...emptyLeaveForm, staffId: staff.id, startDate, endDate });
        }

        function updateLeaveStatus(id, status) {
          setState((current) => ({
            ...current,
            leaveRequests: (current.leaveRequests || []).map((request) =>
              request.id === id ? { ...request, status, updatedAt: new Date().toISOString() } : request
            ),
          }));
        }

        function deleteLeaveRequest(id) {
          setState((current) => ({
            ...current,
            leaveRequests: (current.leaveRequests || []).filter((request) => request.id !== id),
          }));
          if (leaveForm.id === id) setLeaveForm(emptyLeaveForm);
        }

        function printLeaveReport() {
          document.body.classList.add("leave-printing");
          setTimeout(() => {
            window.print();
            setTimeout(() => document.body.classList.remove("leave-printing"), 400);
          }, 50);
        }

        function downloadLeaveReportExcel() {
          downloadExcelFile(`leave-report-${rangeLabel(leaveRange, leaveDate, leaveMonth)}`, [
            {
              title: "Leave Summary",
              rows: [
                ["Report", leaveTitle],
                ["Requests", leaveReportRows.length],
                ["Total Days", leaveTotalDays],
                ["Approved Days", leaveApprovedDays],
                ["Pending", leavePendingCount],
              ],
            },
            {
              title: "Staff Leave Summary",
              rows: [
                ["Staff", "Role", "Requests", "Approved Days", "Pending"],
                ...leaveSummaryRows.map((staff) => [
                  staff.name,
                  staff.role,
                  staff.requests,
                  staff.approvedDays,
                  staff.pending,
                ]),
              ],
            },
            {
              title: "Leave Records",
              rows: [
                ["Staff", "Role", "Type", "Start", "End", "Days", "Status", "Reason"],
                ...leaveReportRows.map((request) => [
                  request.staffName,
                  request.role,
                  request.type,
                  request.startDate,
                  request.endDate || request.startDate,
                  leaveDays(request.startDate, request.endDate),
                  request.status,
                  request.reason || "",
                ]),
              ],
            },
          ]);
        }

        function downloadAttendanceReportExcel() {
          downloadExcelFile(`attendance-report-${rangeLabel(attendanceRange, attendanceDate, attendanceMonth)}`, [
            {
              title: "Attendance Summary",
              rows: [
                ["Report", attendanceTitle],
                ["Shifts", attendanceCards.length],
                ["Total Hours", formatHours(attendanceTotalHours)],
                ["Open Shifts", attendanceOpenShifts],
                ["Generated", displayDateTime()],
              ],
            },
            {
              title: "Staff Hours Summary",
              rows: [
                ["Staff", "Role", "Shifts", "Hours", "Status"],
                ...attendanceStaffRows.map((staff) => [
                  staff.name,
                  staff.role,
                  staff.shifts,
                  formatHours(staff.hours),
                  staff.onDuty ? "On Duty" : "Off Duty",
                ]),
              ],
            },
            {
              title: "Clock In Out Records",
              rows: [
                ["Date", "Staff", "Role", "Clock In", "Clock Out", "Hours", "Status"],
                ...attendanceCards.map((card) => [
                  card.date,
                  card.staffName,
                  card.role,
                  displayTime(card.clockIn),
                  card.clockOut ? displayTime(card.clockOut) : "",
                  formatHours(shiftHours(card)),
                  card.clockOut ? "Clocked Out" : "On Duty",
                ]),
              ],
            },
          ]);
        }

        const attendanceTitle =
          attendanceRange === "today"
            ? `Attendance Report / ${displayDate(attendanceDate)}`
            : attendanceRange === "month"
            ? `Attendance Report / ${attendanceMonth}`
            : "Attendance Report / All Records";
        const leaveTitle =
          leaveRange === "today"
            ? `Leave Report / ${displayDate(leaveDate)}`
            : leaveRange === "month"
            ? `Leave Report / ${leaveMonth}`
            : "Leave Report / All Records";

        return (
          <div className="grid h-full grid-cols-1 gap-5 overflow-auto p-5 xl:grid-cols-[340px_420px_1fr]">
            <section className="rounded-lg border border-line bg-panel p-5">
              <h3 className="text-xl font-black">Staff Clock</h3>
              <label className="mt-5 block text-sm font-semibold text-zinc-400">Employee</label>
              <select
                value={selectedStaffId}
                onChange={(event) => setSelectedStaffId(event.target.value)}
                className="mt-2 min-h-14 w-full rounded-lg border border-line bg-ink px-4 text-white outline-none focus:border-orange"
              >
                {staffDirectory.map((staff) => (
                  <option key={staff.id} value={staff.id}>
                    {staff.name} - {staff.role}
                  </option>
                ))}
              </select>
              <div className="mt-4 grid grid-cols-2 gap-3">
                <button
                  onClick={() => clock("in")}
                  className="min-h-14 rounded-lg border border-emerald-400/30 bg-emerald-500/10 font-black text-emerald-200"
                >
                  Clock In
                </button>
                <button
                  onClick={() => clock("out")}
                  className="min-h-14 rounded-lg border border-line bg-ink font-black"
                >
                  Clock Out
                </button>
              </div>
              <div className="mt-5 rounded-lg border border-line bg-ink p-4">
                <div className="text-sm text-zinc-400">Today On Duty</div>
                <div className="mt-2 text-5xl font-black text-emerald-300">{onDuty.length}</div>
              </div>
              <div className="mt-3 grid grid-cols-2 gap-3">
                <div className="rounded-lg border border-line bg-ink p-4">
                  <div className="text-sm text-zinc-400">Today Hours</div>
                  <div className="mt-2 text-2xl font-black text-orange2">{formatHours(todayHours)}</div>
                </div>
                <div className="rounded-lg border border-line bg-ink p-4">
                  <div className="text-sm text-zinc-400">Month Hours</div>
                  <div className="mt-2 text-2xl font-black text-orange2">{formatHours(monthHours)}</div>
                </div>
              </div>
            </section>

            <section className="rounded-lg border border-line bg-panel p-5">
              <h3 className="text-xl font-black">{editingStaff ? "Edit Staff Name" : "Staff Directory"}</h3>
              <div className="mt-4 space-y-3">
                <div>
                  <label className="text-sm font-semibold text-zinc-400">Staff Name</label>
                  <input
                    value={staffForm.name}
                    onChange={(event) => setStaffForm({ ...staffForm, name: event.target.value })}
                    placeholder="Enter staff name"
                    className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-4 text-white outline-none focus:border-orange"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Role</label>
                    <input
                      value={staffForm.role}
                      onChange={(event) => setStaffForm({ ...staffForm, role: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">PIN</label>
                    <input
                      value={staffForm.pin}
                      onChange={(event) => setStaffForm({ ...staffForm, pin: event.target.value })}
                      inputMode="numeric"
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={saveStaff}
                    className="min-h-12 rounded-lg bg-orange font-black text-black"
                  >
                    {editingStaff ? "Save Staff" : "Add Staff"}
                  </button>
                  <button
                    onClick={() => setStaffForm(emptyStaffForm)}
                    className="min-h-12 rounded-lg border border-line bg-ink font-black"
                  >
                    Clear
                  </button>
                </div>
              </div>

              <div className="mt-5 space-y-3">
                {staffDirectory.map((staff) => (
                  <div key={staff.id} className="rounded-lg border border-line bg-ink p-3">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <div className="font-black">{staff.name}</div>
                        <div className="mt-1 text-sm text-zinc-400">
                          {staff.role} / PIN {staff.pin}
                        </div>
                      </div>
                      <span className="rounded-full border border-line bg-panel px-2 py-1 text-xs font-bold text-zinc-300">
                        Login
                      </span>
                    </div>
                    <div className="mt-3 grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setStaffForm({ ...staff })}
                        className="min-h-10 rounded-md border border-line bg-panel text-xs font-bold"
                      >
                        Edit Name
                      </button>
                      <button
                        onClick={() => deleteStaff(staff.id)}
                        className="min-h-10 rounded-md border border-rose-400/30 bg-rose-500/10 text-xs font-bold text-rose-200"
                      >
                        Delete
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            <section className="space-y-5">
              <div id="leave-print-area" className="rounded-lg border border-line bg-panel p-5">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div>
                    <h3 className="text-xl font-black">{leaveTitle}</h3>
                    <div className="mt-1 text-sm text-zinc-400">
                      Record staff leave, approval status, and total leave days.
                    </div>
                  </div>
                  <div className="screen-only flex flex-wrap gap-2">
                    <button
                      onClick={printLeaveReport}
                      className="min-h-11 rounded-lg border border-line bg-ink px-4 text-sm font-black text-zinc-300"
                    >
                      Print Leave Report
                    </button>
                    <button
                      onClick={downloadLeaveReportExcel}
                      className="min-h-11 rounded-lg bg-orange px-4 text-sm font-black text-black"
                    >
                      Download Excel
                    </button>
                  </div>
                </div>

                <div className="screen-only mt-4 grid grid-cols-1 gap-3 lg:grid-cols-2">
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Staff</label>
                    <select
                      value={leaveForm.staffId}
                      onChange={(event) => setLeaveForm({ ...leaveForm, staffId: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    >
                      {staffDirectory.map((staff) => (
                        <option key={staff.id} value={staff.id}>
                          {staff.name} - {staff.role}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Leave Type</label>
                    <select
                      value={leaveForm.type}
                      onChange={(event) => setLeaveForm({ ...leaveForm, type: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    >
                      {LEAVE_TYPES.map((type) => (
                        <option key={type} value={type}>
                          {type}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Start Date</label>
                    <input
                      type="date"
                      value={leaveForm.startDate}
                      onChange={(event) => setLeaveForm({ ...leaveForm, startDate: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">End Date</label>
                    <input
                      type="date"
                      value={leaveForm.endDate}
                      onChange={(event) => setLeaveForm({ ...leaveForm, endDate: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Status</label>
                    <select
                      value={leaveForm.status}
                      onChange={(event) => setLeaveForm({ ...leaveForm, status: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    >
                      {LEAVE_STATUSES.map((status) => (
                        <option key={status} value={status}>
                          {status}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Reason / Note</label>
                    <input
                      value={leaveForm.reason}

      function MenuManagerView({ state, setState, categories }) {
        const emptyForm = {
          id: "",
          name: "",
          category: categories[0],
          price: "",
          image: "",
          popular: false,
          soldOut: false,
        };
        const [form, setForm] = useState(emptyForm);
        const [newCategory, setNewCategory] = useState("");
        const [categoryEdit, setCategoryEdit] = useState(null);
        const editing = Boolean(form.id);

        useEffect(() => {
          if (!categories.includes(form.category)) {
            setForm((current) => ({ ...current, category: categories[0] || "" }));
          }
        }, [categories]);

        function addCategory() {
          const name = newCategory.trim();
          if (!name || categories.some((category) => category.toLowerCase() === name.toLowerCase())) return;
          setState((current) => ({
            ...current,
            menuCategories: [...(current.menuCategories?.length ? current.menuCategories : CATEGORIES), name],
          }));
          setNewCategory("");
        }

        function saveCategoryName() {
          const nextName = categoryEdit?.name?.trim();
          const original = categoryEdit?.original;
          if (!nextName || !original) return;
          if (categories.some((category) => category !== original && category.toLowerCase() === nextName.toLowerCase())) return;
          setState((current) => ({
            ...current,
            menuCategories: (current.menuCategories?.length ? current.menuCategories : CATEGORIES).map((category) =>
              category === original ? nextName : category
            ),
            menuItems: current.menuItems.map((item) =>
              item.category === original ? { ...item, category: nextName } : item
            ),
          }));
          setForm((current) => current.category === original ? { ...current, category: nextName } : current);
          setCategoryEdit(null);
        }

        function moveCategory(category, direction) {
          setState((current) => {
            const next = [...(current.menuCategories?.length ? current.menuCategories : CATEGORIES)];
            const index = next.indexOf(category);
            const target = index + direction;
            if (index < 0 || target < 0 || target >= next.length) return current;
            [next[index], next[target]] = [next[target], next[index]];
            return { ...current, menuCategories: next };
          });
        }

        function removeCategory(category) {
          if (state.menuItems.some((item) => item.category === category) || categories.length <= 1) return;
          setState((current) => ({
            ...current,
            menuCategories: (current.menuCategories?.length ? current.menuCategories : CATEGORIES).filter((item) => item !== category),
          }));
        }

        function saveItem() {
          if (!form.name.trim() || !Number(form.price)) return;
          const item = {
            ...form,
            id: form.id || uid("menu"),
            name: form.name.trim(),
            price: Number(form.price),
            image: form.image.trim() || image("photo-1504674900247-0877df9cc836"),
            popular: Boolean(form.popular),
            soldOut: Boolean(form.soldOut),
          };
          setState((current) => ({
            ...current,
            menuItems: editing
              ? current.menuItems.map((menuItem) => (menuItem.id === item.id ? item : menuItem))
              : [item, ...current.menuItems],
          }));
          setForm(emptyForm);
        }

        function removeItem(id) {
          setState((current) => ({
            ...current,
            menuItems: current.menuItems.filter((item) => item.id !== id),
          }));
          if (form.id === id) setForm(emptyForm);
        }

        function toggleSoldOut(id) {
          setState((current) => ({
            ...current,
            menuItems: current.menuItems.map((item) =>
              item.id === id ? { ...item, soldOut: !item.soldOut } : item
            ),
          }));
        }

        return (
          <div className="grid h-full grid-cols-1 gap-5 overflow-auto p-5 xl:grid-cols-[420px_1fr]">
            <section className="rounded-lg border border-line bg-panel p-5">
              <h3 className="text-xl font-black">{editing ? "Edit Menu Item" : "Add Menu Item"}</h3>
              <div className="mt-5 space-y-4">
                <div>
                  <label className="text-sm font-semibold text-zinc-400">Food Name</label>
                  <input
                    value={form.name}
                    onChange={(event) => setForm({ ...form, name: event.target.value })}
                    className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-4 text-white outline-none focus:border-orange"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Category</label>
                    <select
                      value={form.category}
                      onChange={(event) => setForm({ ...form, category: event.target.value })}
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    >
                      {categories.map((category) => (
                        <option key={category} value={category}>
                          {category}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="text-sm font-semibold text-zinc-400">Price</label>
                    <input
                      value={form.price}
                      onChange={(event) => setForm({ ...form, price: event.target.value })}
                      inputMode="decimal"
                      className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-3 text-white outline-none focus:border-orange"
                    />
                  </div>
                </div>
                <div>
                  <label className="text-sm font-semibold text-zinc-400">Image URL</label>
                  <input
                    value={form.image}
                    onChange={(event) => setForm({ ...form, image: event.target.value })}
                    placeholder="https://..."
                    className="mt-2 min-h-12 w-full rounded-lg border border-line bg-ink px-4 text-white outline-none focus:border-orange"
                  />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <label className="flex min-h-12 items-center gap-3 rounded-lg border border-line bg-ink px-4">
                    <input
                      type="checkbox"
                      checked={form.popular}
                      onChange={(event) => setForm({ ...form, popular: event.target.checked })}
                    />
                    <span className="font-semibold">Popular</span>
                  </label>
                  <label className="flex min-h-12 items-center gap-3 rounded-lg border border-line bg-ink px-4">
                    <input
                      type="checkbox"
                      checked={form.soldOut}
                      onChange={(event) => setForm({ ...form, soldOut: event.target.checked })}
                    />
                    <span className="font-semibold">Sold Out</span>
                  </label>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <button
                    onClick={saveItem}
                    className="min-h-14 rounded-lg bg-orange font-black text-black"
                  >
                    {editing ? "Save Changes" : "Add Item"}
                  </button>
                  <button
                    onClick={() => setForm(emptyForm)}
                    className="min-h-14 rounded-lg border border-line bg-ink font-black"
                  >
                    Clear
                  </button>
                </div>
              </div>
            </section>

            <section className="rounded-lg border border-line bg-panel p-5">
              <div className="border-b border-line pb-5">
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <h3 className="text-xl font-black">Category Setup</h3>
                    <p className="mt-1 text-sm text-zinc-400">Add, rename and arrange the order screen categories.</p>
                  </div>
                  <span className="rounded-full border border-line bg-ink px-3 py-1 text-sm font-bold text-orange2">{categories.length}</span>
                </div>
                <div className="mt-4 flex gap-2">
                  <input
                    value={newCategory}
                    onChange={(event) => setNewCategory(event.target.value)}
                    onKeyDown={(event) => event.key === "Enter" && addCategory()}
                    placeholder="New category name"
                    className="min-h-12 flex-1 rounded-lg border border-line bg-ink px-4 text-white outline-none focus:border-orange"
                  />
                  <button onClick={addCategory} className="min-h-12 rounded-lg bg-orange px-5 font-black text-black">Add</button>
                </div>
                <div className="mt-3 grid grid-cols-1 gap-2 lg:grid-cols-2">
                  {categories.map((category, index) => {
                    const itemCount = state.menuItems.filter((item) => item.category === category).length;
                    const editingCategory = categoryEdit?.original === category;
                    return (
                      <div key={category} className="flex min-h-14 items-center gap-2 rounded-lg border border-line bg-ink p-2">
                        {editingCategory ? (
                          <input
                            value={categoryEdit.name}
                            onChange={(event) => setCategoryEdit({ ...categoryEdit, name: event.target.value })}
                            onKeyDown={(event) => event.key === "Enter" && saveCategoryName()}
                            className="min-w-0 flex-1 rounded-md border border-orange bg-panel px-3 py-2 text-white outline-none"
                          />
                        ) : (
                          <div className="min-w-0 flex-1 px-2">
                            <div className="truncate font-bold">{category}</div>
                            <div className="text-xs text-zinc-500">{itemCount} items</div>
                          </div>
                        )}
                        {editingCategory ? (
                          <>
                            <button onClick={saveCategoryName} className="min-h-10 rounded-md bg-orange px-3 text-xs font-black text-black">Save</button>
                            <button onClick={() => setCategoryEdit(null)} className="min-h-10 rounded-md border border-line bg-panel px-3 text-xs font-bold">Cancel</button>
                          </>
                        ) : (
                          <>
                            <button title="Move up" disabled={index === 0} onClick={() => moveCategory(category, -1)} className="h-10 w-10 rounded-md border border-line bg-panel font-black disabled:opacity-30">↑</button>
                            <button title="Move down" disabled={index === categories.length - 1} onClick={() => moveCategory(category, 1)} className="h-10 w-10 rounded-md border border-line bg-panel font-black disabled:opacity-30">↓</button>
                            <button onClick={() => setCategoryEdit({ original: category, name: category })} className="min-h-10 rounded-md border border-line bg-panel px-3 text-xs font-bold">Edit</button>
                            <button
                              title={itemCount ? "Move or delete its menu items first" : "Delete category"}
                              disabled={itemCount > 0 || categories.length <= 1}
                              onClick={() => removeCategory(category)}
                              className="min-h-10 rounded-md border border-rose-400/30 bg-rose-500/10 px-3 text-xs font-bold text-rose-200 disabled:cursor-not-allowed disabled:opacity-30"
                            >
                              Delete
                            </button>
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              <h3 className="mt-5 text-xl font-black">Menu Back Office</h3>
              <div className="mt-4 grid grid-cols-1 gap-3 lg:grid-cols-2">
                {state.menuItems.map((item) => (
                  <div key={item.id} className="flex gap-4 rounded-lg border border-line bg-ink p-3">
                    <img src={item.image} alt={item.name} className="h-24 w-24 rounded-md object-cover" />
                    <div className="min-w-0 flex-1">
                      <div className="flex items-start justify-between gap-3">
                        <div>
                          <div className="font-black">{item.name}</div>
                          <div className="mt-1 text-sm text-zinc-400">
                            {item.category} / {money(item.price)}
                          </div>
                        </div>
                        <span className={cx("rounded-full border px-2 py-1 text-xs font-bold", item.soldOut ? statusClass("Held") : statusClass("Available"))}>
                          {item.soldOut ? "Sold Out" : "Available"}
                        </span>
                      </div>
                      <div className="mt-3 grid grid-cols-3 gap-2">
                        <button
                          onClick={() => setForm({ ...item, price: String(item.price) })}
                          className="min-h-10 rounded-md border border-line bg-panel text-xs font-bold"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => toggleSoldOut(item.id)}
                          className="min-h-10 rounded-md border border-line bg-panel text-xs font-bold"
                        >
                          Sold Out
                        </button>
                        <button

            ? "border-rose-400/30 bg-rose-500/10 text-rose-200"

        const websiteLink = posPublicUrl();

        useEffect(() => {
          setCloudForm({ ...defaultCloudConfig, ...(cloudConfig || {}) });

        function saveSettings() {
          setState((current) => ({
            ...current,
            settings: {
              businessName: settingsForm.businessName.trim() || defaultSettings.businessName,
              tagline: settingsForm.tagline.trim() || defaultSettings.tagline,
              managerName: settingsForm.managerName.trim() || defaultSettings.managerName,
              managerPin: settingsForm.managerPin.trim() || defaultSettings.managerPin,

        function saveStaff() {
          if (!staffForm.name.trim() || !staffForm.pin.trim()) return;
          const nextStaff = {
            id: staffForm.id || uid("staff"),
            name: staffForm.name.trim(),
            role: staffForm.role.trim() || "Server",
            pin: staffForm.pin.trim(),

          setState((current) => saveStaffToState(current, nextStaff, editingStaff));
          setStaffForm(emptyStaffForm);

          setState((current) => deleteStaffFromState(current, id));

        function saveCloudSettings() {
          setCloudConfig(normalizeCloudConfig(cloudForm));

          setCloudConfig(next);
          setCloudCopyMessage("");

        async function copyText(value, successMessage) {
          try {
            await navigator.clipboard.writeText(value);
            setCloudCopyMessage(successMessage);

            window.prompt("Copy link", value);
            setCloudCopyMessage(`${successMessage} If it was not copied automatically, copy it from the popup.`);
          }

        async function copyCloudSetupLink() {
          const next = normalizeCloudConfig({ ...cloudForm, enabled: true }, true);

            setCloudCopyMessage("Fill Firebase fields first.");
            return;

          setCloudForm(next);

          await copyText(

            "Sync link copied and enabled here. Open it once on phone, iPad, or PC."

        async function testBluetoothPrinter() {
          if (!navigator.bluetooth) {
            setPrinterStatus("Direct Bluetooth is not supported in this browser. Pair the printer in device settings, then use Print Receipt / system print.");
            return;
          }

          try {
            setPrinterStatus("Choose your Bluetooth receipt printer...");
            const device = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: [
                "0000ff00-0000-1000-8000-00805f9b34fb",
                "0000ffe0-0000-1000-8000-00805f9b34fb",
                "0000fff0-0000-1000-8000-00805f9b34fb",
              ],
            });
            if (device.gatt) {

            }
            setPrinterStatus(`Bluetooth detected: ${device.name || "Receipt printer"}. If it does not print from the browser, use system print or AirPrint.`);

                  ))}
                </div>
                <div className="my-4 border-t border-line"></div>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between text-zinc-300">
                    <span>Subtotal</span>
                    <span>{money(receipt.subtotal)}</span>
                  </div>
                  <div className="flex justify-between text-zinc-300">
                    <span>Service 10%</span>
                    <span>{money(receipt.service)}</span>
                  </div>
                  <div className="flex justify-between text-zinc-300">
                    <span>GST 9%</span>
                    <span>{money(receipt.gst)}</span>
                  </div>
                  <div className="flex justify-between text-zinc-300">
                    <span>Discount</span>
                    <span>{money(receipt.discount)}</span>
                  </div>
                  <div className="flex justify-between pt-2 text-2xl font-black text-orange2">
                    <span>Total</span>
                    <span>{money(receipt.total)}</span>
                  </div>
                  {receipt.method === "Cash" && (
                    <>
                      <div className="flex justify-between text-zinc-300">
                        <span>Cash Received</span>
                        <span>{money(receipt.tendered || receipt.total)}</span>
                      </div>
                      <div className="flex justify-between text-zinc-300">
                        <span>Change</span>
                        <span>{money(receipt.changeDue || 0)}</span>
                      </div>
                    </>
                  )}
                </div>
                <div className="mt-5 border-t border-dashed border-line pt-4 text-center text-xs text-zinc-500">
                  Thank you. Please come again.
                </div>
              </div>
              <div className="screen-only mt-5 grid grid-cols-2 gap-3">
                <button
                  onClick={() => window.print()}
                  className="min-h-14 rounded-lg bg-orange font-black text-black"
                >
                  Print Receipt
                </button>
                <button
                  onClick={onClose}
                  className="min-h-14 rounded-lg border border-line bg-ink font-black"
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [state, setState] = useState(loadState);
        const [cloudConfig, setCloudConfig] = useState(loadCloudConfig);
        const [syncStatus, setSyncStatus] = useState({
          kind: "local",
          label: "Local",
          message: "This device only",
        });
        const deviceIdRef = useRef(getDeviceId());
        const stateRef = useRef(state);
        const remoteRef = useRef(null);
        const remoteReadyRef = useRef(false);
        const applyingRemoteRef = useRef(false);
        const lastRemoteRevisionRef = useRef(0);
        const [user, setUser] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem(SESSION_KEY));
          } catch (error) {
            return null;
          }
        });

        useEffect(() => {
          stateRef.current = state;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          document.title = `${state.settings?.businessName || defaultSettings.businessName} | ${state.settings?.tagline || defaultSettings.tagline}`;

          if (!remoteRef.current || !remoteReadyRef.current || !hasCloudConfig(cloudConfig)) return;
          if (applyingRemoteRef.current) {
            applyingRemoteRef.current = false;
            return;
          }

          const revision = Date.now();
          lastRemoteRevisionRef.current = revision;
          setSyncStatus({ kind: "syncing", label: "Syncing", message: "Saving to cloud" });
          remoteRef.current
            .set({
              state,
              revision,
              deviceId: deviceIdRef.current,
              updatedAt: new Date().toISOString(),
            })
            .then(() => {
              setSyncStatus({ kind: "online", label: "Cloud", message: `Synced ${displayTime()}` });
            })
            .catch((error) => {
              setSyncStatus({ kind: "error", label: "Error", message: error.message || "Cloud save failed" });
            });
        }, [state]);

        useEffect(() => {
          localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cloudConfig));
        }, [cloudConfig]);

        useEffect(() => {
          remoteRef.current = null;
          remoteReadyRef.current = false;
          applyingRemoteRef.current = false;
          lastRemoteRevisionRef.current = 0;

          if (!cloudConfig.enabled) {
            setSyncStatus({ kind: "local", label: "Local", message: "This device only" });
            return;
          }

          if (!hasCloudConfig(cloudConfig)) {
            setSyncStatus({ kind: "setup", label: "Setup", message: "Cloud fields needed" });
            return;
          }

          if (!window.firebase?.database) {
            setSyncStatus({ kind: "error", label: "Error", message: "Firebase is not loaded" });
            return;
          }

          let cancelled = false;
          let ref = null;

          async function connectCloud() {
            try {
              setSyncStatus({ kind: "connecting", label: "Cloud", message: "Connecting" });
              const appName = `pos-${sanitizeCloudPath(cloudConfig.restaurantId)}`;
              const app =
                firebase.apps.find((item) => item.name === appName) ||
                firebase.initializeApp(firebaseOptions(cloudConfig), appName);
              ref = firebase.database(app).ref(cloudStatePath(cloudConfig));
              remoteRef.current = ref;

              const snapshot = await ref.once("value");
              if (cancelled) return;
              const payload = snapshot.val();

              if (payload?.state) {
                lastRemoteRevisionRef.current = Number(payload.revision || 0);
                applyingRemoteRef.current = true;
                setState(hydrateState(payload.state));
                setSyncStatus({
                  kind: "online",
                  label: "Cloud",
                  message: `Loaded ${displayTime(payload.updatedAt || new Date())}`,
                });
              } else {
                const revision = Date.now();
                lastRemoteRevisionRef.current = revision;
                await ref.set({
                  state: stateRef.current,
                  revision,
                  deviceId: deviceIdRef.current,
                  updatedAt: new Date().toISOString(),
                });
                setSyncStatus({ kind: "online", label: "Cloud", message: "Cloud ready" });
              }

              remoteReadyRef.current = true;
              ref.on(
                "value",
                (nextSnapshot) => {
                  if (cancelled) return;
                  const nextPayload = nextSnapshot.val();
                  if (!nextPayload?.state) return;
                  const revision = Number(nextPayload.revision || 0);
                  if (nextPayload.deviceId === deviceIdRef.current || revision <= lastRemoteRevisionRef.current) return;
                  lastRemoteRevisionRef.current = revision;
                  applyingRemoteRef.current = true;
                  setState(hydrateState(nextPayload.state));
                  setSyncStatus({
                    kind: "online",
                    label: "Cloud",
                    message: `Updated ${displayTime(nextPayload.updatedAt || new Date())}`,
                  });
                },
                (error) => {
                  setSyncStatus({ kind: "error", label: "Error", message: error.message || "Cloud read failed" });
                }
              );
            } catch (error) {
              setSyncStatus({ kind: "error", label: "Error", message: error.message || "Cloud connection failed" });
            }
          }

          connectCloud();

          return () => {
            cancelled = true;
            if (ref) ref.off();
          };
        }, [
          cloudConfig.enabled,
          cloudConfig.apiKey,
          cloudConfig.authDomain,
          cloudConfig.databaseURL,
          cloudConfig.projectId,
          cloudConfig.appId,
          cloudConfig.restaurantId,
        ]);

        if (!user) {
          return <LoginScreen state={state} setState={setState} onLogin={setUser} />;
        }

        return (
          <AppShell
            user={user}
            setUser={setUser}
            state={state}
            setState={setState}
            cloudConfig={cloudConfig}
            setCloudConfig={setCloudConfig}
            syncStatus={syncStatus}
          />
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
